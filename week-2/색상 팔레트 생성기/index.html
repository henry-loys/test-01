<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>색상 팔레트 생성기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.35s ease-out both; }
    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .animate-pop { animation: pop 0.3s ease-out; }
    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useMemo, useRef, useEffect } = React;

    // ========================================
    // 🛠️ Color Utility Functions
    // ========================================

    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      return {
        r: parseInt(h.substring(0, 2), 16),
        g: parseInt(h.substring(2, 4), 16),
        b: parseInt(h.substring(4, 6), 16),
      };
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
    }

    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100),
      };
    }

    function rgbToCmyk(r, g, b) {
      if (r === 0 && g === 0 && b === 0) return { c: 0, m: 0, y: 0, k: 100 };
      const rr = r / 255, gg = g / 255, bb = b / 255;
      const k = 1 - Math.max(rr, gg, bb);
      return {
        c: Math.round(((1 - rr - k) / (1 - k)) * 100),
        m: Math.round(((1 - gg - k) / (1 - k)) * 100),
        y: Math.round(((1 - bb - k) / (1 - k)) * 100),
        k: Math.round(k * 100),
      };
    }

    function generateShades(hex, count = 5) {
      const { r, g, b } = hexToRgb(hex);
      const lighter = [];
      const darker = [];
      for (let i = 1; i <= count; i++) {
        const t = i / (count + 1);
        lighter.push(rgbToHex(
          r + (255 - r) * t,
          g + (255 - g) * t,
          b + (255 - b) * t,
        ));
        darker.push(rgbToHex(
          r * (1 - t),
          g * (1 - t),
          b * (1 - t),
        ));
      }
      return { lighter, darker };
    }

    function getContrastColor(hex) {
      const { r, g, b } = hexToRgb(hex);
      const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return luminance > 0.55 ? '#1a1a2e' : '#ffffff';
    }

    function isValidHex(hex) {
      return /^#?([0-9A-Fa-f]{6})$/.test(hex);
    }

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children }) {
      const base = 'font-semibold rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 cursor-pointer';
      const variants = {
        primary: 'bg-gray-900 hover:bg-gray-800 text-white focus:ring-gray-500 shadow-lg',
        secondary: 'bg-gray-100 hover:bg-gray-200 text-gray-700 focus:ring-gray-400',
        ghost: 'bg-transparent hover:bg-gray-100 text-gray-600 focus:ring-gray-300',
      };
      const sizes = { sm: 'px-3 py-1.5 text-sm', md: 'px-5 py-2.5 text-base', lg: 'px-7 py-3.5 text-lg' };
      return (
        <button className={`${base} ${variants[variant]} ${sizes[size]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`} onClick={onClick} disabled={disabled}>
          {children}
        </button>
      );
    }

    function Card({ children, className = '' }) {
      return <div className={`bg-white rounded-2xl shadow-lg ${className}`}>{children}</div>;
    }

    // ========================================
    // 🧩 Color Swatch Component
    // ========================================

    function ColorSwatch({ hex, label, delay = 0, showFormats = false }) {
      const [copied, setCopied] = useState(false);
      const [popKey, setPopKey] = useState(0);
      const contrast = getContrastColor(hex);
      const { r, g, b } = hexToRgb(hex);
      const hsl = rgbToHsl(r, g, b);

      const copy = useCallback((text) => {
        navigator.clipboard.writeText(text).then(() => {
          setCopied(true);
          setPopKey(k => k + 1);
          setTimeout(() => setCopied(false), 1200);
        });
      }, []);

      return (
        <div className="animate-slide-up" style={{ animationDelay: `${delay}ms` }}>
          <div
            className="rounded-2xl p-5 cursor-pointer transition-all duration-200 hover:scale-[1.03] hover:shadow-xl relative group"
            style={{ backgroundColor: hex }}
            onClick={() => copy(hex.toUpperCase())}
          >
            <div key={popKey} className={copied ? 'animate-pop' : ''}>
              {label && <p className="text-xs font-medium mb-1 opacity-70" style={{ color: contrast }}>{label}</p>}
              <p className="font-bold text-lg tracking-wide" style={{ color: contrast }}>
                {copied ? '복사됨!' : hex.toUpperCase()}
              </p>
            </div>
            {showFormats && (
              <div className="mt-3 space-y-1">
                <FormatRow label="RGB" value={`${r}, ${g}, ${b}`} contrast={contrast} onCopy={copy} />
                <FormatRow label="HSL" value={`${hsl.h}°, ${hsl.s}%, ${hsl.l}%`} contrast={contrast} onCopy={copy} />
              </div>
            )}
            <div className="absolute top-2 right-3 opacity-0 group-hover:opacity-60 transition-opacity text-xs" style={{ color: contrast }}>
              클릭하여 복사
            </div>
          </div>
        </div>
      );
    }

    function FormatRow({ label, value, contrast, onCopy }) {
      return (
        <button
          className="flex items-center gap-2 text-xs w-full text-left rounded-lg px-2 py-1 hover:bg-black/10 transition-colors cursor-pointer"
          style={{ color: contrast }}
          onClick={(e) => { e.stopPropagation(); onCopy(value); }}
        >
          <span className="font-semibold opacity-60 w-8">{label}</span>
          <span className="font-mono">{value}</span>
        </button>
      );
    }

    // ========================================
    // 📄 Color Info Panel
    // ========================================

    function ColorInfoPanel({ hex }) {
      const { r, g, b } = hexToRgb(hex);
      const hsl = rgbToHsl(r, g, b);
      const cmyk = rgbToCmyk(r, g, b);
      const contrast = getContrastColor(hex);

      const formats = [
        { label: 'HEX', value: hex.toUpperCase(), css: hex.toUpperCase() },
        { label: 'RGB', value: `${r}, ${g}, ${b}`, css: `rgb(${r}, ${g}, ${b})` },
        { label: 'HSL', value: `${hsl.h}°, ${hsl.s}%, ${hsl.l}%`, css: `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)` },
        { label: 'CMYK', value: `${cmyk.c}%, ${cmyk.m}%, ${cmyk.y}%, ${cmyk.k}%`, css: null },
      ];

      const [copiedIdx, setCopiedIdx] = useState(null);

      const copy = (text, idx) => {
        navigator.clipboard.writeText(text).then(() => {
          setCopiedIdx(idx);
          setTimeout(() => setCopiedIdx(null), 1200);
        });
      };

      return (
        <Card className="overflow-hidden animate-slide-up">
          <div className="p-6 flex flex-col items-center" style={{ backgroundColor: hex }}>
            <p className="text-5xl font-black tracking-tight" style={{ color: contrast }}>{hex.toUpperCase()}</p>
            <p className="text-sm mt-2 opacity-70" style={{ color: contrast }}>같은 정보, 다른 형태</p>
          </div>
          <div className="p-5">
            <h3 className="text-sm font-bold text-gray-500 uppercase tracking-wider mb-3">색상 형식</h3>
            <div className="space-y-2">
              {formats.map((f, i) => (
                <button
                  key={f.label}
                  onClick={() => copy(f.css || f.value, i)}
                  className="w-full flex items-center justify-between px-4 py-3 rounded-xl bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer group"
                >
                  <div className="flex items-center gap-3">
                    <span className="text-xs font-bold text-gray-400 w-10 text-left">{f.label}</span>
                    <span className="font-mono text-gray-800 text-sm">{f.value}</span>
                  </div>
                  <span className="text-xs text-gray-400 group-hover:text-gray-600 transition-colors">
                    {copiedIdx === i ? '복사됨!' : '복사'}
                  </span>
                </button>
              ))}
            </div>
          </div>
        </Card>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const [hexInput, setHexInput] = useState('#6366F1');
      const [activeColor, setActiveColor] = useState('#6366F1');
      const [history, setHistory] = useState([]);
      const inputRef = useRef(null);

      const shades = useMemo(() => generateShades(activeColor, 5), [activeColor]);

      const applyColor = useCallback((hex) => {
        const normalized = hex.startsWith('#') ? hex : '#' + hex;
        if (!isValidHex(normalized)) return;
        setActiveColor(normalized);
        setHexInput(normalized);
        setHistory(prev => {
          const filtered = prev.filter(c => c.toLowerCase() !== normalized.toLowerCase());
          return [normalized, ...filtered].slice(0, 12);
        });
      }, []);

      const handleHexChange = (e) => {
        let val = e.target.value;
        if (!val.startsWith('#')) val = '#' + val;
        setHexInput(val);
        if (isValidHex(val)) applyColor(val);
      };

      const handlePickerChange = (e) => {
        const val = e.target.value;
        setHexInput(val);
        applyColor(val);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') applyColor(hexInput);
      };

      const randomColor = () => {
        const hex = '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0');
        applyColor(hex);
      };

      const validInput = isValidHex(hexInput);

      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100">
          {/* Header */}
          <header className="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-40">
            <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
              <div>
                <h1 className="text-2xl font-black text-gray-800 tracking-tight">색상 팔레트 생성기</h1>
                <p className="text-xs text-gray-400 mt-0.5">HEX 입력 → 밝은/어두운 변형 5단계</p>
              </div>
              <Button onClick={randomColor} variant="secondary" size="sm">🎲 랜덤</Button>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 py-8 space-y-8">
            {/* Input Section */}
            <Card className="p-6">
              <div className="flex flex-col sm:flex-row gap-4 items-end">
                <div className="relative">
                  <label className="text-sm font-medium text-gray-500 block mb-2">Color Picker</label>
                  <input
                    type="color"
                    value={activeColor}
                    onChange={handlePickerChange}
                    className="w-16 h-16 rounded-2xl cursor-pointer shadow-md hover:shadow-lg transition-shadow"
                  />
                </div>
                <div className="flex-1 w-full">
                  <label className="text-sm font-medium text-gray-500 block mb-2">HEX 코드</label>
                  <div className="flex gap-3">
                    <div className="relative flex-1">
                      <input
                        ref={inputRef}
                        type="text"
                        value={hexInput}
                        onChange={handleHexChange}
                        onKeyDown={handleKeyDown}
                        placeholder="#6366F1"
                        maxLength={7}
                        className={`w-full px-4 py-3 rounded-xl border-2 font-mono text-lg tracking-wider transition-all focus:outline-none focus:ring-2 ${
                          validInput
                            ? 'border-gray-200 focus:border-gray-400 focus:ring-gray-200'
                            : 'border-red-300 focus:border-red-400 focus:ring-red-200'
                        }`}
                      />
                      {!validInput && hexInput.length > 1 && (
                        <p className="absolute -bottom-5 left-1 text-xs text-red-400">올바른 HEX 코드를 입력하세요 (예: #FF5733)</p>
                      )}
                    </div>
                    <Button onClick={() => applyColor(hexInput)} disabled={!validInput}>
                      생성
                    </Button>
                  </div>
                </div>
              </div>

              {/* History */}
              {history.length > 0 && (
                <div className="mt-5 pt-4 border-t border-gray-100">
                  <p className="text-xs font-medium text-gray-400 mb-2">최근 사용한 색상</p>
                  <div className="flex flex-wrap gap-2">
                    {history.map((c, i) => (
                      <button
                        key={c + i}
                        onClick={() => applyColor(c)}
                        className="w-8 h-8 rounded-lg cursor-pointer transition-transform hover:scale-110 shadow-sm hover:shadow-md"
                        style={{ backgroundColor: c }}
                        title={c.toUpperCase()}
                      />
                    ))}
                  </div>
                </div>
              )}
            </Card>

            {/* Color Info */}
            <ColorInfoPanel hex={activeColor} />

            {/* Lighter Shades */}
            <section>
              <h2 className="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-gray-200 inline-block"></span>
                밝은 변형 (Tints)
              </h2>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                {shades.lighter.map((hex, i) => (
                  <ColorSwatch
                    key={hex + i}
                    hex={hex}
                    label={`+${(i + 1) * 15}%`}
                    delay={i * 60}
                    showFormats
                  />
                ))}
              </div>
            </section>

            {/* Base Color */}
            <section>
              <h2 className="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
                <span className="w-3 h-3 rounded-full inline-block" style={{ backgroundColor: activeColor }}></span>
                기준 색상 (Base)
              </h2>
              <div className="max-w-xs">
                <ColorSwatch hex={activeColor} label="Base" delay={0} showFormats />
              </div>
            </section>

            {/* Darker Shades */}
            <section>
              <h2 className="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
                <span className="w-3 h-3 rounded-full bg-gray-800 inline-block"></span>
                어두운 변형 (Shades)
              </h2>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                {shades.darker.map((hex, i) => (
                  <ColorSwatch
                    key={hex + i}
                    hex={hex}
                    label={`-${(i + 1) * 15}%`}
                    delay={i * 60}
                    showFormats
                  />
                ))}
              </div>
            </section>

            {/* Full Palette Strip */}
            <section>
              <h2 className="text-lg font-bold text-gray-700 mb-4">전체 팔레트 미리보기</h2>
              <Card className="overflow-hidden">
                <div className="flex h-20">
                  {[...shades.lighter].reverse().map((hex, i) => (
                    <div key={'l' + i} className="flex-1 transition-all hover:flex-[2]" style={{ backgroundColor: hex }} title={hex.toUpperCase()} />
                  ))}
                  <div className="flex-[1.5] relative" style={{ backgroundColor: activeColor }} title={activeColor.toUpperCase()}>
                    <span className="absolute inset-0 flex items-center justify-center text-xs font-bold" style={{ color: getContrastColor(activeColor) }}>BASE</span>
                  </div>
                  {shades.darker.map((hex, i) => (
                    <div key={'d' + i} className="flex-1 transition-all hover:flex-[2]" style={{ backgroundColor: hex }} title={hex.toUpperCase()} />
                  ))}
                </div>
              </Card>
            </section>

            <footer className="text-center text-xs text-gray-300 pb-8 pt-4">
              색상을 클릭하면 HEX 코드가 클립보드에 복사됩니다
            </footer>
          </main>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
