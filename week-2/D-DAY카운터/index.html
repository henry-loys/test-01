<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-DAY 카운터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes pulse-slow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .animate-pulse-slow { animation: pulse-slow 2s ease-in-out infinite; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slide-in { animation: slideIn 0.3s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled = false, onClick, className = '', children }) {
      const base = 'font-semibold rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 cursor-pointer';
      const variants = {
        primary: 'bg-indigo-600 hover:bg-indigo-700 text-white focus:ring-indigo-500 shadow-lg shadow-indigo-200',
        secondary: 'bg-gray-100 hover:bg-gray-200 text-gray-700 focus:ring-gray-400',
        danger: 'bg-red-500 hover:bg-red-600 text-white focus:ring-red-400 shadow-lg shadow-red-200',
        ghost: 'bg-transparent hover:bg-gray-100 text-gray-600 focus:ring-gray-300',
      };
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-5 py-2.5 text-base',
        lg: 'px-7 py-3.5 text-lg',
      };
      return (
        <button
          className={`${base} ${variants[variant]} ${sizes[size]} ${disabled ? 'opacity-50 cursor-not-allowed' : ''} ${className}`}
          onClick={onClick}
          disabled={disabled}
        >
          {children}
        </button>
      );
    }

    function Input({ type = 'text', label, value, onChange, placeholder, error, className = '' }) {
      return (
        <div className={`flex flex-col gap-1.5 ${className}`}>
          {label && <label className="text-sm font-medium text-gray-600">{label}</label>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            className={`px-4 py-3 rounded-xl border-2 ${error ? 'border-red-400 focus:ring-red-300' : 'border-gray-200 focus:border-indigo-400 focus:ring-indigo-200'} focus:outline-none focus:ring-2 transition-all bg-white text-gray-800`}
          />
          {error && <p className="text-sm text-red-500">{error}</p>}
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-2xl shadow-lg p-6 ${className}`}>
          {children}
        </div>
      );
    }

    function Modal({ isOpen, onClose, title, children }) {
      if (!isOpen) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" onClick={onClose}>
          <div className="fixed inset-0 bg-black/40 backdrop-blur-sm" />
          <div
            className="relative bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md animate-slide-in"
            onClick={e => e.stopPropagation()}
          >
            <div className="flex items-center justify-between mb-5">
              <h2 className="text-xl font-bold text-gray-800">{title}</h2>
              <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none cursor-pointer">&times;</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Common Components
    // ========================================

    function TimeUnit({ value, label }) {
      return (
        <div className="flex flex-col items-center">
          <div className="bg-white/90 backdrop-blur rounded-xl shadow-md px-4 py-3 min-w-[70px] text-center">
            <span className="text-3xl sm:text-4xl font-bold text-indigo-700 tabular-nums">{String(value).padStart(2, '0')}</span>
          </div>
          <span className="text-xs font-medium text-gray-500 mt-1.5">{label}</span>
        </div>
      );
    }

    function ColorPicker({ selected, onChange }) {
      const colors = [
        { name: 'indigo', bg: 'bg-indigo-500', gradient: 'from-indigo-500 to-purple-600' },
        { name: 'rose', bg: 'bg-rose-500', gradient: 'from-rose-500 to-pink-600' },
        { name: 'emerald', bg: 'bg-emerald-500', gradient: 'from-emerald-500 to-teal-600' },
        { name: 'amber', bg: 'bg-amber-500', gradient: 'from-amber-500 to-orange-600' },
        { name: 'sky', bg: 'bg-sky-500', gradient: 'from-sky-500 to-blue-600' },
        { name: 'violet', bg: 'bg-violet-500', gradient: 'from-violet-500 to-purple-700' },
      ];
      return (
        <div className="flex gap-2">
          {colors.map(c => (
            <button
              key={c.name}
              onClick={() => onChange(c)}
              className={`w-8 h-8 rounded-full ${c.bg} cursor-pointer transition-transform ${selected?.name === c.name ? 'ring-2 ring-offset-2 ring-gray-400 scale-110' : 'hover:scale-110'}`}
            />
          ))}
        </div>
      );
    }

    // ========================================
    // 📄 D-DAY Card Component
    // ========================================

    function DdayCard({ item, now, onDelete }) {
      const target = new Date(item.date + 'T00:00:00');
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffMs = target.getTime() - now.getTime();
      const diffDays = Math.ceil((target.getTime() - todayStart.getTime()) / (1000 * 60 * 60 * 24));
      const isPast = diffDays < 0;
      const isToday = diffDays === 0;

      const hours = Math.floor(Math.abs(diffMs) / (1000 * 60 * 60)) % 24;
      const minutes = Math.floor(Math.abs(diffMs) / (1000 * 60)) % 60;
      const seconds = Math.floor(Math.abs(diffMs) / 1000) % 60;

      const gradient = item.color?.gradient || 'from-indigo-500 to-purple-600';

      return (
        <div className="animate-slide-in">
          <Card className="overflow-hidden hover:shadow-xl transition-shadow duration-300">
            <div className={`bg-gradient-to-r ${gradient} -mx-6 -mt-6 px-6 pt-5 pb-4 mb-5`}>
              <div className="flex items-start justify-between">
                <div>
                  <h3 className="text-white font-bold text-lg">{item.title}</h3>
                  <p className="text-white/80 text-sm mt-1">
                    {target.getFullYear()}년 {target.getMonth() + 1}월 {target.getDate()}일
                  </p>
                </div>
                <button
                  onClick={() => onDelete(item.id)}
                  className="text-white/60 hover:text-white text-xl leading-none cursor-pointer transition-colors"
                  aria-label="삭제"
                >
                  &times;
                </button>
              </div>
              <div className="mt-4">
                {isToday ? (
                  <p className="text-white text-3xl font-black animate-pulse-slow">D-DAY!</p>
                ) : (
                  <p className="text-white text-3xl font-black">
                    D{isPast ? '+' : '-'}{Math.abs(diffDays)}
                  </p>
                )}
              </div>
            </div>

            <div className="flex justify-center gap-3">
              {!isToday && (
                <>
                  <TimeUnit value={Math.abs(diffDays)} label="일" />
                  <div className="flex items-center text-gray-300 text-2xl font-light pt-[-8px]">:</div>
                </>
              )}
              <TimeUnit value={hours} label="시간" />
              <div className="flex items-center text-gray-300 text-2xl font-light">:</div>
              <TimeUnit value={minutes} label="분" />
              <div className="flex items-center text-gray-300 text-2xl font-light">:</div>
              <TimeUnit value={seconds} label="초" />
            </div>

            {isPast && (
              <p className="text-center text-sm text-gray-400 mt-4">
                {Math.abs(diffDays)}일이 지났습니다
              </p>
            )}
          </Card>
        </div>
      );
    }

    // ========================================
    // 🚀 App Component
    // ========================================

    function App() {
      const [items, setItems] = useState(() => {
        try {
          const saved = localStorage.getItem('dday-items');
          return saved ? JSON.parse(saved) : [];
        } catch { return []; }
      });
      const [now, setNow] = useState(new Date());
      const [modalOpen, setModalOpen] = useState(false);
      const [title, setTitle] = useState('');
      const [date, setDate] = useState('');
      const [selectedColor, setSelectedColor] = useState({ name: 'indigo', bg: 'bg-indigo-500', gradient: 'from-indigo-500 to-purple-600' });
      const [error, setError] = useState('');

      // 실시간 업데이트 (1초마다)
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // localStorage 저장
      useEffect(() => {
        localStorage.setItem('dday-items', JSON.stringify(items));
      }, [items]);

      const handleAdd = useCallback(() => {
        if (!title.trim()) { setError('제목을 입력해주세요'); return; }
        if (!date) { setError('날짜를 선택해주세요'); return; }

        const newItem = {
          id: Date.now(),
          title: title.trim(),
          date,
          color: selectedColor,
          createdAt: new Date().toISOString(),
        };

        setItems(prev => [newItem, ...prev]);
        setTitle('');
        setDate('');
        setError('');
        setSelectedColor({ name: 'indigo', bg: 'bg-indigo-500', gradient: 'from-indigo-500 to-purple-600' });
        setModalOpen(false);
      }, [title, date, selectedColor]);

      const handleDelete = useCallback((id) => {
        setItems(prev => prev.filter(item => item.id !== id));
      }, []);

      const sorted = [...items].sort((a, b) => {
        const da = Math.abs(new Date(a.date).getTime() - now.getTime());
        const db = Math.abs(new Date(b.date).getTime() - now.getTime());
        return da - db;
      });

      return (
        <div className="min-h-screen bg-gradient-to-br from-gray-50 via-indigo-50/30 to-purple-50/30">
          {/* Header */}
          <header className="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-40">
            <div className="max-w-2xl mx-auto px-4 py-4 flex items-center justify-between">
              <div>
                <h1 className="text-2xl font-black text-gray-800 tracking-tight">D-DAY</h1>
                <p className="text-xs text-gray-400 mt-0.5">
                  {now.getFullYear()}년 {now.getMonth() + 1}월 {now.getDate()}일 {['일','월','화','수','목','금','토'][now.getDay()]}요일
                </p>
              </div>
              <Button onClick={() => setModalOpen(true)} size="md">
                + 새 D-DAY
              </Button>
            </div>
          </header>

          {/* Content */}
          <main className="max-w-2xl mx-auto px-4 py-6">
            {sorted.length === 0 ? (
              <div className="text-center py-20">
                <div className="text-6xl mb-4">📅</div>
                <h2 className="text-xl font-bold text-gray-600 mb-2">아직 D-DAY가 없습니다</h2>
                <p className="text-gray-400 mb-6">새로운 D-DAY를 추가해보세요!</p>
                <Button onClick={() => setModalOpen(true)}>첫 D-DAY 만들기</Button>
              </div>
            ) : (
              <div className="grid gap-5">
                {sorted.map(item => (
                  <DdayCard key={item.id} item={item} now={now} onDelete={handleDelete} />
                ))}
              </div>
            )}
          </main>

          {/* Add Modal */}
          <Modal isOpen={modalOpen} onClose={() => { setModalOpen(false); setError(''); }} title="새 D-DAY 추가">
            <div className="flex flex-col gap-4">
              <Input
                label="제목"
                value={title}
                onChange={e => { setTitle(e.target.value); setError(''); }}
                placeholder="예: 여행 출발일, 시험일..."
              />
              <Input
                type="date"
                label="목표 날짜"
                value={date}
                onChange={e => { setDate(e.target.value); setError(''); }}
              />
              <div>
                <label className="text-sm font-medium text-gray-600 block mb-2">색상</label>
                <ColorPicker selected={selectedColor} onChange={setSelectedColor} />
              </div>
              {error && <p className="text-sm text-red-500 bg-red-50 px-3 py-2 rounded-lg">{error}</p>}
              <Button onClick={handleAdd} className="w-full mt-2" size="lg">
                추가하기
              </Button>
            </div>
          </Modal>
        </div>
      );
    }

    // ========================================
    // Rendering
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
