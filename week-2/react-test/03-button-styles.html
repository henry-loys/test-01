<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버튼 스타일 모음</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; padding: 40px; background: #fafafa; }
    h1 { text-align: center; margin-bottom: 32px; color: #333; }
    .section { margin-bottom: 24px; text-align: center; }
    .section h3 { margin-bottom: 12px; color: #666; font-size: 14px; }
    button {
      padding: 10px 24px;
      margin: 4px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: #4f46e5; color: white; }
    .btn-primary:hover { background: #4338ca; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-outline {
      background: transparent;
      border: 2px solid #4f46e5;
      color: #4f46e5;
    }
    .btn-outline:hover { background: #4f46e5; color: white; }
    .btn-rounded { border-radius: 50px; padding: 10px 28px; background: #8b5cf6; color: white; }
    .btn-rounded:hover { background: #7c3aed; }
    .btn-ghost { background: transparent; color: #6b7280; }
    .btn-ghost:hover { background: #f3f4f6; }
    .btn-lg { padding: 14px 32px; font-size: 16px; background: #0ea5e9; color: white; border-radius: 10px; }
    .btn-sm { padding: 6px 14px; font-size: 12px; background: #f59e0b; color: white; }
  </style>
</head>
<body>
  <h1>버튼 스타일 모음</h1>
  <div class="section">
    <h3>기본 버튼</h3>
    <button class="btn-primary">Primary</button>
    <button class="btn-success">Success</button>
    <button class="btn-danger">Danger</button>
  </div>
  <div class="section">
    <h3>변형 버튼</h3>
    <button class="btn-outline">Outline</button>
    <button class="btn-rounded">Rounded</button>
    <button class="btn-ghost">Ghost</button>
  </div>
  <div class="section">
    <h3>크기 버튼</h3>
    <button class="btn-lg">Large</button>
    <button class="btn-primary">Medium</button>
    <button class="btn-sm">Small</button>
  </div>
</body>
</html>
