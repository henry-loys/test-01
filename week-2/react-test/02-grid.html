<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid 카드 레이아웃</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
    h1 { text-align: center; margin-bottom: 24px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #0f3460;
      transition: border-color 0.3s;
    }
    .card:hover { border-color: #e94560; }
    .card h2 { font-size: 18px; margin-bottom: 8px; color: #e94560; }
    .card p { font-size: 14px; line-height: 1.6; color: #aaa; }
    .tag {
      display: inline-block;
      background: #0f3460;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 12px;
      color: #53d8fb;
    }
  </style>
</head>
<body>
  <h1>Grid 카드 레이아웃</h1>
  <div class="grid">
    <div class="card">
      <h2>HTML</h2>
      <p>웹 페이지의 구조를 정의하는 마크업 언어입니다.</p>
      <span class="tag">기초</span>
    </div>
    <div class="card">
      <h2>CSS</h2>
      <p>웹 페이지의 스타일과 레이아웃을 담당합니다.</p>
      <span class="tag">스타일</span>
    </div>
    <div class="card">
      <h2>JavaScript</h2>
      <p>웹 페이지에 동적인 기능을 추가합니다.</p>
      <span class="tag">프로그래밍</span>
    </div>
  </div>
</body>
</html>
