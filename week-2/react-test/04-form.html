<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>폼 스타일링</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }
    .form-card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      width: 360px;
    }
    .form-card h2 { margin-bottom: 24px; color: #333; text-align: center; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #667eea;
    }
    textarea { resize: vertical; min-height: 80px; }
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="form-card">
    <h2>회원가입</h2>
    <form>
      <label for="name">이름</label>
      <input type="text" id="name" placeholder="홍길동">

      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="example@email.com">

      <label for="role">직업</label>
      <select id="role">
        <option value="">선택하세요</option>
        <option value="dev">개발자</option>
        <option value="designer">디자이너</option>
        <option value="pm">기획자</option>
      </select>

      <label for="bio">자기소개</label>
      <textarea id="bio" placeholder="간단히 소개해주세요"></textarea>

      <button type="submit" class="submit-btn">가입하기</button>
    </form>
  </div>
</body>
</html>
