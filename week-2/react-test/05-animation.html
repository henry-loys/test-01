<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 애니메이션</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: sans-serif;
      padding: 40px;
      background: #0f172a;
      color: white;
      text-align: center;
    }
    h1 { margin-bottom: 40px; }

    .demo { margin-bottom: 40px; }
    .demo h3 { margin-bottom: 16px; color: #94a3b8; font-size: 14px; }

    /* 1. 바운스 */
    .bounce {
      width: 60px; height: 60px;
      background: #f43f5e;
      border-radius: 50%;
      margin: 0 auto;
      animation: bounce 1s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }

    /* 2. 회전 */
    .spin {
      width: 60px; height: 60px;
      border: 4px solid transparent;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      margin: 0 auto;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 3. 펄스 */
    .pulse {
      width: 60px; height: 60px;
      background: #10b981;
      border-radius: 50%;
      margin: 0 auto;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* 4. 슬라이드 */
    .slide-track {
      width: 300px;
      margin: 0 auto;
      overflow: hidden;
      background: #1e293b;
      border-radius: 8px;
      padding: 10px 0;
    }
    .slide {
      width: 50px; height: 50px;
      background: #f59e0b;
      border-radius: 8px;
      animation: slide 2s ease-in-out infinite alternate;
    }
    @keyframes slide {
      from { transform: translateX(0); }
      to { transform: translateX(250px); }
    }

    /* 5. 페이드 글자 */
    .fade-text {
      font-size: 24px;
      font-weight: bold;
      background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradient 3s ease infinite;
    }
    @keyframes gradient {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
  </style>
</head>
<body>
  <h1>CSS 애니메이션 모음</h1>

  <div class="demo">
    <h3>Bounce</h3>
    <div class="bounce"></div>
  </div>

  <div class="demo">
    <h3>Spinner</h3>
    <div class="spin"></div>
  </div>

  <div class="demo">
    <h3>Pulse</h3>
    <div class="pulse"></div>
  </div>

  <div class="demo">
    <h3>Slide</h3>
    <div class="slide-track">
      <div class="slide"></div>
    </div>
  </div>

  <div class="demo">
    <h3>Gradient Text</h3>
    <p class="fade-text">Hello, CSS Animation!</p>
  </div>
</body>
</html>
