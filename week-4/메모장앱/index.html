<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: #000000;
      color: #f5f5f7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }
    /* Subtle scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a2c; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a3a3c; }
    /* Minimal fade-in */
    @keyframes appleFade {
      from { opacity: 0; transform: translateY(2px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .apple-fade { animation: appleFade 0.2s ease-out both; }
    /* Focus ring */
    .focus-violet:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
    }
    /* Editor textarea: no focus ring, blends into surface */
    .editor-surface:focus {
      outline: none;
      box-shadow: none;
    }
    /* Hide number spinners if any */
    input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useMemo, useCallback, useRef } = React;

    // ========================================
    // Constants
    // ========================================
    const STORAGE_KEY = 'memos:v1';

    const COLOR_OPTIONS = [
      { key: 'default', name: '기본',   hex: '#8b5cf6' },  // violet (existing accent)
      { key: 'blue',    name: '블루',   hex: '#60a5fa' },
      { key: 'teal',    name: '틸',     hex: '#2dd4bf' },
      { key: 'green',   name: '그린',   hex: '#34d399' },
      { key: 'amber',   name: '앰버',   hex: '#fbbf24' },
      { key: 'orange',  name: '오렌지', hex: '#fb923c' },
      { key: 'pink',    name: '핑크',   hex: '#f472b6' },
    ];
    function colorHex(key) { return (COLOR_OPTIONS.find(c => c.key === key) || COLOR_OPTIONS[0]).hex; }
    const COLOR_KEYS = COLOR_OPTIONS.map(c => c.key);

    const PRIORITY_LEVELS = [
      { value: 0, label: '일반', short: '',     hex: null },
      { value: 1, label: '중요', short: '중요', hex: '#fbbf24' }, // amber
      { value: 2, label: '긴급', short: '긴급', hex: '#f87171' }, // red-400
    ];
    function priorityMeta(value) {
      return PRIORITY_LEVELS.find(p => p.value === value) || PRIORITY_LEVELS[0];
    }

    // ========================================
    // Storage helpers (pure frontend)
    // ========================================
    function normalizeMemo(m) {
      const color = (m && typeof m.color === 'string' && COLOR_KEYS.includes(m.color)) ? m.color : 'default';
      const priorityRaw = m && typeof m.priority === 'number' ? m.priority : 0;
      const priority = (priorityRaw === 1 || priorityRaw === 2) ? priorityRaw : 0;
      return { ...m, color, priority };
    }

    function loadMemos() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed
          .filter((m) => m && typeof m === 'object' && typeof m.id === 'string')
          .map(normalizeMemo);
      } catch (_) {
        return [];
      }
    }

    function saveMemos(memos) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
      } catch (_) {
        /* ignore quota errors */
      }
    }

    function newId() {
      if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      return 'm-' + Math.random().toString(36).slice(2) + '-' + Date.now().toString(36);
    }

    // ========================================
    // Formatting helpers
    // ========================================
    function formatRelative(ts) {
      if (!ts) return '';
      const now = Date.now();
      const diff = Math.max(0, now - ts);
      const sec = Math.floor(diff / 1000);
      if (sec < 60) return '방금 전';
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}분 전`;
      const hour = Math.floor(min / 60);
      if (hour < 24) return `${hour}시간 전`;
      const day = Math.floor(hour / 24);
      if (day === 1) return '어제';
      if (day < 7) return `${day}일 전`;
      const d = new Date(ts);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}.${mm}.${dd}`;
    }

    function formatFull(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${yyyy}.${mm}.${dd} ${hh}:${mi}`;
    }

    function firstLinePreview(body) {
      if (!body) return '';
      const idx = body.indexOf('\n');
      const line = idx >= 0 ? body.slice(0, idx) : body;
      return line.trim();
    }

    // ========================================
    // Design System: Icons
    // ========================================
    function IconPlus({ className = 'w-4 h-4' }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      );
    }

    function IconTrash({ className = 'w-4 h-4' }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="3 6 5 6 21 6" />
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
          <path d="M10 11v6M14 11v6" />
          <path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2" />
        </svg>
      );
    }

    function IconSearch({ className = 'w-4 h-4' }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      );
    }

    function IconBack({ className = 'w-4 h-4' }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      );
    }

    function IconDoc({ className = 'w-6 h-6' }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="8" y1="13" x2="16" y2="13" />
          <line x1="8" y1="17" x2="14" y2="17" />
        </svg>
      );
    }

    function IconCheckSaved({ className = 'w-3.5 h-3.5' }) {
      return (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      );
    }

    // ========================================
    // Design System: Button
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, type = 'button', className = '', children, title, ariaLabel }) {
      const base = 'inline-flex items-center justify-center gap-2 font-medium rounded-full transition-all duration-200 focus:outline-none disabled:opacity-40 disabled:cursor-not-allowed';
      const sizes = {
        sm: 'px-4 py-1.5 text-[13px]',
        md: 'px-5 py-2.5 text-sm',
        lg: 'px-7 py-3 text-base',
      };
      const variants = {
        primary:   'bg-violet-500 text-white hover:bg-violet-400 active:bg-violet-600',
        secondary: 'bg-transparent text-white border border-white/20 hover:border-white/40 hover:bg-white/5',
        ghost:     'text-white/60 hover:text-white',
      };
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          title={title}
          aria-label={ariaLabel}
          className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}
        >
          {children}
        </button>
      );
    }

    // ========================================
    // Layout: Hero header (Apple style)
    // ========================================
    function Header({ total }) {
      return (
        <header className="pt-12 pb-10 sm:pt-20 sm:pb-14 text-center">
          <p className="text-[13px] font-medium text-violet-400 tracking-wide mb-3">MEMO</p>
          <h1 className="text-4xl sm:text-6xl font-semibold tracking-tight text-white leading-tight">
            생각을 적다.
            <br className="sm:hidden" />
            <span className="text-[#a1a1a6]"> 가볍게.</span>
          </h1>
          <p className="mt-5 text-base sm:text-lg text-[#a1a1a6] max-w-xl mx-auto">
            {total === 0
              ? '아직 작성한 메모가 없습니다. 첫 번째 메모를 만들어 보세요.'
              : <>총 <span className="text-white font-medium">{total}</span>개의 메모가 저장되어 있습니다.</>
            }
          </p>
        </header>
      );
    }

    // ========================================
    // Search Bar
    // ========================================
    function SearchBar({ value, onChange }) {
      return (
        <div className="relative">
          <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#6b6b70]">
            <IconSearch className="w-4 h-4" />
          </span>
          <input
            type="search"
            value={value}
            onChange={(e) => onChange(e.target.value)}
            placeholder="메모 검색"
            className="w-full pl-10 pr-4 py-2.5 rounded-full bg-[#1c1c1e] border border-[#2c2c2e] text-white placeholder-[#6b6b70] text-[14px] focus-violet transition"
            aria-label="메모 검색"
          />
        </div>
      );
    }

    // ========================================
    // Memo List Item
    // ========================================
    function MemoListItem({ memo, active, onSelect, onDelete }) {
      const title = (memo.title || '').trim() || '제목 없음';
      const preview = firstLinePreview(memo.body) || (memo.body ? '' : '내용 없음');
      const dotHex = colorHex(memo.color);
      const pMeta = priorityMeta(memo.priority || 0);
      return (
        <li
          role="button"
          tabIndex={0}
          onClick={onSelect}
          onKeyDown={(e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              onSelect();
            }
          }}
          className={[
            'apple-fade group relative cursor-pointer px-4 py-3.5 border-b border-[#1c1c1e] transition-colors duration-200',
            active ? 'bg-[#1c1c1e]' : 'hover:bg-white/[0.03]',
          ].join(' ')}
        >
          <div className="flex items-start gap-3">
            <div className="flex-1 min-w-0">
              <div className={`truncate text-[14px] font-semibold flex items-center gap-2 ${active ? 'text-white' : 'text-[#f5f5f7]'}`}>
                <span
                  aria-hidden="true"
                  className="inline-block shrink-0 rounded-full"
                  style={{ width: '6px', height: '6px', background: dotHex }}
                />
                <span className="truncate">{title}</span>
              </div>
              <div className="mt-0.5 flex items-center gap-2 text-[12px] text-[#6b6b70]">
                <span className="shrink-0">{formatRelative(memo.updatedAt)}</span>
                {pMeta.value > 0 && (
                  <>
                    <span className="text-[#3a3a3c]">·</span>
                    <span
                      className="shrink-0 text-[11px]"
                      style={{ color: pMeta.value === 2 ? '#fca5a5' : '#fcd34d' }}
                    >
                      {pMeta.short}
                    </span>
                  </>
                )}
                {preview && (
                  <>
                    <span className="text-[#3a3a3c]">·</span>
                    <span className="truncate text-[#a1a1a6]">{preview}</span>
                  </>
                )}
              </div>
            </div>
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); onDelete(); }}
              title="메모 삭제"
              aria-label="메모 삭제"
              className="shrink-0 p-1.5 rounded-full text-[#6b6b70] hover:text-white hover:bg-white/5 transition opacity-0 group-hover:opacity-100 focus:opacity-100"
            >
              <IconTrash className="w-4 h-4" />
            </button>
          </div>
          {active && (
            <span
              aria-hidden="true"
              className="absolute left-0 top-0 bottom-0 w-[3px] rounded-r-full"
              style={{ background: dotHex }}
            />
          )}
        </li>
      );
    }

    // ========================================
    // Memo List (left column)
    // ========================================
    function MemoList({ memos, activeId, onSelect, onCreate, onDelete, query, onQueryChange, hasAny }) {
      return (
        <div className="flex flex-col h-full">
          <div className="px-4 pt-4 pb-3 border-b border-[#1c1c1e] space-y-3">
            <div className="flex items-center justify-between gap-2">
              <h2 className="text-[15px] font-semibold text-white">메모</h2>
              <Button size="sm" onClick={onCreate} ariaLabel="새 메모 만들기">
                <IconPlus className="w-3.5 h-3.5" />
                <span>새 메모</span>
              </Button>
            </div>
            <SearchBar value={query} onChange={onQueryChange} />
          </div>
          <ul className="flex-1 overflow-y-auto">
            {memos.length === 0 ? (
              <li className="px-6 py-16 text-center">
                {hasAny ? (
                  <>
                    <div className="inline-flex w-12 h-12 rounded-full bg-[#1c1c1e] border border-[#2c2c2e] items-center justify-center mb-4">
                      <IconSearch className="w-5 h-5 text-[#6b6b70]" />
                    </div>
                    <p className="text-[#a1a1a6] text-[14px]">검색 결과가 없습니다</p>
                    <p className="text-[#6b6b70] text-[12px] mt-1">다른 키워드를 입력해 보세요</p>
                  </>
                ) : (
                  <>
                    <div className="inline-flex w-12 h-12 rounded-full bg-[#1c1c1e] border border-[#2c2c2e] items-center justify-center mb-4">
                      <IconDoc className="w-5 h-5 text-[#6b6b70]" />
                    </div>
                    <p className="text-[#a1a1a6] text-[14px]">아직 메모가 없습니다</p>
                    <p className="text-[#6b6b70] text-[12px] mt-1">위의 새 메모 버튼으로 시작하세요</p>
                  </>
                )}
              </li>
            ) : (
              memos.map((m) => (
                <MemoListItem
                  key={m.id}
                  memo={m}
                  active={m.id === activeId}
                  onSelect={() => onSelect(m.id)}
                  onDelete={() => onDelete(m.id)}
                />
              ))
            )}
          </ul>
        </div>
      );
    }

    // ========================================
    // Editor (right column)
    // ========================================
    function Editor({ memo, onChange, onDelete, onBack, savedPulse }) {
      const titleRef = useRef(null);

      // Auto-focus title when switching to an empty-title memo
      useEffect(() => {
        if (!memo) return;
        if (!memo.title && titleRef.current) {
          titleRef.current.focus();
        }
      }, [memo?.id]);

      if (!memo) {
        return (
          <div className="h-full flex items-center justify-center px-8">
            <div className="text-center">
              <div className="inline-flex w-16 h-16 rounded-full bg-[#1c1c1e] border border-[#2c2c2e] items-center justify-center mb-5">
                <IconDoc className="w-7 h-7 text-[#6b6b70]" />
              </div>
              <p className="text-[#a1a1a6] text-[15px]">메모를 선택하거나 새로 만들어 보세요</p>
              <p className="text-[#6b6b70] text-[13px] mt-1.5">왼쪽 목록에서 메모를 선택할 수 있습니다</p>
            </div>
          </div>
        );
      }

      return (
        <div className="h-full flex flex-col">
          {/* Toolbar */}
          <div className="flex items-center justify-between gap-2 px-5 sm:px-8 py-4 border-b border-[#1c1c1e]">
            <div className="flex items-center gap-2 min-w-0">
              {onBack && (
                <button
                  type="button"
                  onClick={onBack}
                  aria-label="목록으로"
                  title="목록으로"
                  className="sm:hidden p-2 -ml-2 rounded-full text-[#a1a1a6] hover:text-white hover:bg-white/5 transition"
                >
                  <IconBack className="w-5 h-5" />
                </button>
              )}
              <div className="min-w-0">
                <div className="text-[12px] text-[#6b6b70] truncate">
                  마지막 수정: {formatFull(memo.updatedAt)}
                </div>
              </div>
            </div>
            <div className="flex items-center gap-3">
              {/* Color picker */}
              <div
                role="radiogroup"
                aria-label="메모 색상"
                className="hidden xs:flex items-center gap-1.5 sm:flex"
              >
                {COLOR_OPTIONS.map((c) => {
                  const selected = (memo.color || 'default') === c.key;
                  return (
                    <button
                      key={c.key}
                      type="button"
                      role="radio"
                      aria-checked={selected}
                      title={c.name}
                      aria-label={`색상 ${c.name}`}
                      onClick={() => onChange({ color: c.key })}
                      className={[
                        'rounded-full transition-all duration-200 focus:outline-none',
                        selected
                          ? 'ring-2 ring-white/60 ring-offset-1 ring-offset-[#0c0c0e]'
                          : 'ring-1 ring-white/15 hover:ring-white/30',
                      ].join(' ')}
                      style={{ width: '16px', height: '16px', background: c.hex }}
                    />
                  );
                })}
              </div>

              {/* Priority toggle */}
              {(() => {
                const current = memo.priority || 0;
                const meta = priorityMeta(current);
                const next = (current + 1) % 3;
                const styles = [
                  'border border-white/20 text-[#a1a1a6] hover:border-white/40',
                  'bg-amber-500/15 border border-amber-400/40 text-amber-300 hover:bg-amber-500/20',
                  'bg-red-500/15 border border-red-400/40 text-red-300 hover:bg-red-500/20',
                ];
                return (
                  <button
                    type="button"
                    onClick={() => onChange({ priority: next })}
                    title={`우선순위: ${meta.label} (클릭하여 변경)`}
                    aria-label={`우선순위 ${meta.label}, 클릭하여 변경`}
                    className={[
                      'inline-flex items-center justify-center rounded-full px-2.5 py-0.5 text-[11px] font-medium transition-all duration-200 focus:outline-none',
                      styles[current],
                    ].join(' ')}
                  >
                    {meta.label}
                  </button>
                );
              })()}

              <span
                className={[
                  'inline-flex items-center gap-1.5 text-[12px] transition-opacity duration-300',
                  savedPulse ? 'text-violet-400 opacity-100' : 'text-[#6b6b70] opacity-70',
                ].join(' ')}
                aria-live="polite"
              >
                <IconCheckSaved className="w-3.5 h-3.5" />
                <span>{savedPulse ? '저장됨' : '자동 저장'}</span>
              </span>
              <button
                type="button"
                onClick={onDelete}
                aria-label="메모 삭제"
                title="메모 삭제"
                className="p-2 rounded-full text-[#a1a1a6] hover:text-white hover:bg-white/5 transition"
              >
                <IconTrash className="w-4 h-4" />
              </button>
            </div>
          </div>

          {/* Body */}
          <div className="flex-1 overflow-y-auto">
            <div className="max-w-3xl mx-auto px-5 sm:px-8 py-8 sm:py-12">
              <input
                ref={titleRef}
                type="text"
                value={memo.title}
                onChange={(e) => onChange({ title: e.target.value })}
                placeholder="제목"
                className="w-full bg-transparent text-white text-3xl sm:text-4xl font-semibold tracking-tight placeholder-[#3a3a3c] editor-surface border-0 p-0"
                aria-label="메모 제목"
              />
              <div className="mt-3 mb-6 text-[12px] text-[#6b6b70]">
                {formatFull(memo.createdAt)}
              </div>
              <textarea
                value={memo.body}
                onChange={(e) => onChange({ body: e.target.value })}
                placeholder="여기에 메모를 작성하세요."
                rows={18}
                className="w-full bg-transparent text-[#f5f5f7] text-[15px] leading-7 placeholder-[#3a3a3c] editor-surface resize-none border-0 p-0"
                aria-label="메모 내용"
              />
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // Main Page: MemoApp
    // ========================================
    function MemoApp() {
      const [memos, setMemos] = useState(() => loadMemos());
      const [activeId, setActiveId] = useState(null);
      const [query, setQuery] = useState('');
      const [mobileView, setMobileView] = useState('list'); // 'list' | 'editor'
      const [savedPulse, setSavedPulse] = useState(false);

      // Persist to localStorage whenever memos change
      useEffect(() => {
        saveMemos(memos);
      }, [memos]);

      // Pulse "saved" indicator briefly after any memo update
      const pulseSaved = useCallback(() => {
        setSavedPulse(true);
        const t = setTimeout(() => setSavedPulse(false), 900);
        return () => clearTimeout(t);
      }, []);

      // Sorted & filtered list
      const sortedMemos = useMemo(() => {
        return [...memos].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
      }, [memos]);

      const filteredMemos = useMemo(() => {
        const q = query.trim().toLowerCase();
        if (!q) return sortedMemos;
        return sortedMemos.filter((m) => {
          const t = (m.title || '').toLowerCase();
          const b = (m.body || '').toLowerCase();
          return t.includes(q) || b.includes(q);
        });
      }, [sortedMemos, query]);

      const activeMemo = useMemo(
        () => memos.find((m) => m.id === activeId) || null,
        [memos, activeId]
      );

      // ---- Debounced pulse trigger when activeMemo.updatedAt changes ----
      const lastUpdatedRef = useRef(null);
      useEffect(() => {
        if (!activeMemo) { lastUpdatedRef.current = null; return; }
        if (lastUpdatedRef.current !== null && lastUpdatedRef.current !== activeMemo.updatedAt) {
          const cleanup = pulseSaved();
          lastUpdatedRef.current = activeMemo.updatedAt;
          return cleanup;
        }
        lastUpdatedRef.current = activeMemo.updatedAt;
      }, [activeMemo, pulseSaved]);

      // ---- Debounced update for editor typing ----
      // We keep a local "draft" for the active memo so keystrokes are fluid,
      // and flush to the main memos state after ~400ms of inactivity.
      const [draft, setDraft] = useState(null); // { id, title, body } | null
      const flushTimerRef = useRef(null);

      // When active memo changes, reset draft from the authoritative memo
      useEffect(() => {
        if (activeMemo) {
          setDraft({
            id: activeMemo.id,
            title: activeMemo.title,
            body: activeMemo.body,
            color: activeMemo.color || 'default',
            priority: activeMemo.priority || 0,
          });
        } else {
          setDraft(null);
        }
        // Cancel any pending flush when switching memos
        if (flushTimerRef.current) {
          clearTimeout(flushTimerRef.current);
          flushTimerRef.current = null;
        }
      }, [activeMemo?.id]);

      // Flush draft into memos state
      const flushDraft = useCallback((nextDraft) => {
        setMemos((prev) => {
          const idx = prev.findIndex((m) => m.id === nextDraft.id);
          if (idx < 0) return prev;
          const current = prev[idx];
          if (
            current.title === nextDraft.title &&
            current.body === nextDraft.body &&
            (current.color || 'default') === nextDraft.color &&
            (current.priority || 0) === nextDraft.priority
          ) return prev;
          const updated = {
            ...current,
            title: nextDraft.title,
            body: nextDraft.body,
            color: nextDraft.color,
            priority: nextDraft.priority,
            updatedAt: Date.now(),
          };
          const copy = prev.slice();
          copy[idx] = updated;
          return copy;
        });
      }, []);

      const handleDraftChange = useCallback((patch) => {
        setDraft((prev) => {
          if (!prev) return prev;
          const next = { ...prev, ...patch };
          // schedule flush
          if (flushTimerRef.current) clearTimeout(flushTimerRef.current);
          flushTimerRef.current = setTimeout(() => {
            flushDraft(next);
            flushTimerRef.current = null;
          }, 400);
          return next;
        });
      }, [flushDraft]);

      // Flush on unmount to avoid losing last keystrokes
      useEffect(() => {
        return () => {
          if (flushTimerRef.current && draft) {
            clearTimeout(flushTimerRef.current);
            flushDraft(draft);
          }
        };
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      // ---- Actions ----
      const handleCreate = useCallback(() => {
        const now = Date.now();
        const memo = {
          id: newId(),
          title: '',
          body: '',
          color: 'default',
          priority: 0,
          createdAt: now,
          updatedAt: now,
        };
        setMemos((prev) => [memo, ...prev]);
        setActiveId(memo.id);
        setMobileView('editor');
        setQuery('');
      }, []);

      const handleSelect = useCallback((id) => {
        // Flush any pending draft for the currently active memo before switching
        if (flushTimerRef.current && draft) {
          clearTimeout(flushTimerRef.current);
          flushTimerRef.current = null;
          flushDraft(draft);
        }
        setActiveId(id);
        setMobileView('editor');
      }, [draft, flushDraft]);

      const handleDelete = useCallback((id) => {
        const target = memos.find((m) => m.id === id);
        if (!target) return;
        const hasContent = (target.title && target.title.trim()) || (target.body && target.body.trim());
        if (hasContent) {
          const titleLabel = (target.title || '').trim() || '제목 없는 메모';
          const ok = window.confirm(`"${titleLabel}"을(를) 삭제할까요? 이 작업은 되돌릴 수 없습니다.`);
          if (!ok) return;
        }
        // If deleting the active memo, cancel any pending flush
        if (activeId === id && flushTimerRef.current) {
          clearTimeout(flushTimerRef.current);
          flushTimerRef.current = null;
        }
        setMemos((prev) => prev.filter((m) => m.id !== id));
        if (activeId === id) {
          setActiveId(null);
          setMobileView('list');
        }
      }, [memos, activeId]);

      const handleDeleteActive = useCallback(() => {
        if (activeId) handleDelete(activeId);
      }, [activeId, handleDelete]);

      const handleBackToList = useCallback(() => {
        // Flush pending draft so the list shows the latest content/timestamp
        if (flushTimerRef.current && draft) {
          clearTimeout(flushTimerRef.current);
          flushTimerRef.current = null;
          flushDraft(draft);
        }
        setMobileView('list');
      }, [draft, flushDraft]);

      // The editor works against the live draft (if matching active memo)
      const editorMemo = useMemo(() => {
        if (!activeMemo) return null;
        if (draft && draft.id === activeMemo.id) {
          return {
            ...activeMemo,
            title: draft.title,
            body: draft.body,
            color: draft.color,
            priority: draft.priority,
          };
        }
        return activeMemo;
      }, [activeMemo, draft]);

      // ---- Render ----
      return (
        <div className="min-h-screen">
          <div className="max-w-6xl mx-auto px-5 sm:px-8 pb-16">
            <Header total={memos.length} />

            <div className="rounded-2xl border border-[#2c2c2e] bg-[#0c0c0e] overflow-hidden">
              {/* Two-column layout on sm+; view toggle on mobile */}
              <div className="grid grid-cols-1 sm:grid-cols-[320px_1fr] min-h-[560px] sm:min-h-[640px]">
                {/* List column */}
                <aside
                  className={[
                    'sm:border-r sm:border-[#1c1c1e] h-full',
                    mobileView === 'list' ? 'block' : 'hidden sm:block',
                  ].join(' ')}
                  style={{ maxHeight: 'calc(100vh - 120px)' }}
                >
                  <div className="h-full sm:max-h-none" style={{ height: '100%' }}>
                    <div className="flex flex-col h-full max-h-[80vh] sm:max-h-[75vh]">
                      <MemoList
                        memos={filteredMemos}
                        activeId={activeId}
                        onSelect={handleSelect}
                        onCreate={handleCreate}
                        onDelete={handleDelete}
                        query={query}
                        onQueryChange={setQuery}
                        hasAny={memos.length > 0}
                      />
                    </div>
                  </div>
                </aside>

                {/* Editor column */}
                <section
                  className={[
                    'h-full',
                    mobileView === 'editor' ? 'block' : 'hidden sm:block',
                  ].join(' ')}
                >
                  <div className="flex flex-col h-full max-h-[80vh] sm:max-h-[75vh]">
                    <Editor
                      memo={editorMemo}
                      onChange={handleDraftChange}
                      onDelete={handleDeleteActive}
                      onBack={handleBackToList}
                      savedPulse={savedPulse}
                    />
                  </div>
                </section>
              </div>
            </div>

            <footer className="mt-14 pt-8 border-t border-[#1c1c1e] text-center text-[12px] text-[#6b6b70]">
              Designed in the spirit of simplicity.
            </footer>
          </div>
        </div>
      );
    }

    // ========================================
    // App Root
    // ========================================
    function App() {
      return <MemoApp />;
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
