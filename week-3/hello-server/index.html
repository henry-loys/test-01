<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 테스터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // ========================================
    // 🎨 Design System Components
    // ========================================

    function Button({ variant = 'primary', size = 'md', disabled, onClick, children, className = '', type = 'button' }) {
      const variants = {
        primary: 'bg-blue-600 hover:bg-blue-700 text-white',
        secondary: 'bg-slate-200 hover:bg-slate-300 text-slate-800',
        danger: 'bg-red-600 hover:bg-red-700 text-white',
        ghost: 'bg-transparent hover:bg-slate-100 text-slate-700',
      };
      const sizes = { sm: 'px-3 py-1 text-sm', md: 'px-4 py-2', lg: 'px-6 py-3 text-lg' };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          className={`rounded-lg font-medium transition disabled:opacity-50 disabled:cursor-not-allowed ${variants[variant]} ${sizes[size]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function Input({ label, value, onChange, placeholder, type = 'text', className = '' }) {
      return (
        <div className={className}>
          {label && <label className="block text-sm font-medium text-slate-700 mb-1">{label}</label>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>
      );
    }

    function Textarea({ label, value, onChange, placeholder, rows = 6, className = '' }) {
      return (
        <div className={className}>
          {label && <label className="block text-sm font-medium text-slate-700 mb-1">{label}</label>}
          <textarea
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            rows={rows}
            className="w-full px-3 py-2 border border-slate-300 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>
      );
    }

    function Select({ label, value, onChange, options, className = '' }) {
      return (
        <div className={className}>
          {label && <label className="block text-sm font-medium text-slate-700 mb-1">{label}</label>}
          <select
            value={value}
            onChange={onChange}
            className="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
          >
            {options.map(opt => (
              <option key={opt} value={opt}>{opt}</option>
            ))}
          </select>
        </div>
      );
    }

    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white rounded-xl shadow-sm border border-slate-200 p-6 ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, color = 'slate' }) {
      const colors = {
        slate: 'bg-slate-100 text-slate-700',
        green: 'bg-green-100 text-green-700',
        red: 'bg-red-100 text-red-700',
        yellow: 'bg-yellow-100 text-yellow-700',
        blue: 'bg-blue-100 text-blue-700',
      };
      return (
        <span className={`inline-block px-2 py-0.5 rounded text-xs font-semibold ${colors[color]}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // 📄 API Tester Page
    // ========================================

    const METHODS = ['GET', 'POST', 'PUT', 'DELETE', 'PATCH'];
    const PRESET_ENDPOINTS = [
      { label: '/api/hello', url: '/api/hello' },
      { label: '/api/health', url: '/api/health' },
      { label: '/api/users', url: '/api/users' },
    ];

    function ApiTester() {
      const [method, setMethod] = useState('GET');
      const [url, setUrl] = useState('/api/hello');
      const [body, setBody] = useState('');
      const [headers, setHeaders] = useState('{\n  "Content-Type": "application/json"\n}');
      const [loading, setLoading] = useState(false);
      const [response, setResponse] = useState(null);
      const [error, setError] = useState(null);
      const [history, setHistory] = useState([]);

      const statusColor = (status) => {
        if (!status) return 'slate';
        if (status >= 200 && status < 300) return 'green';
        if (status >= 300 && status < 400) return 'blue';
        if (status >= 400 && status < 500) return 'yellow';
        return 'red';
      };

      const sendRequest = async () => {
        setLoading(true);
        setError(null);
        setResponse(null);

        const startTime = performance.now();
        try {
          let parsedHeaders = {};
          try {
            parsedHeaders = headers.trim() ? JSON.parse(headers) : {};
          } catch (e) {
            throw new Error('헤더 JSON 파싱 실패: ' + e.message);
          }

          const options = { method, headers: parsedHeaders };
          if (method !== 'GET' && method !== 'DELETE' && body.trim()) {
            options.body = body;
          }

          const fullUrl = url.startsWith('http') ? url : window.location.origin + url;
          const res = await fetch(fullUrl, options);
          const elapsed = Math.round(performance.now() - startTime);

          const contentType = res.headers.get('content-type') || '';
          let data;
          if (contentType.includes('application/json')) {
            data = await res.json();
          } else {
            data = await res.text();
          }

          const resHeaders = {};
          res.headers.forEach((v, k) => { resHeaders[k] = v; });

          const result = {
            status: res.status,
            statusText: res.statusText,
            headers: resHeaders,
            data,
            elapsed,
            ok: res.ok,
          };
          setResponse(result);
          setHistory(prev => [{ method, url, status: res.status, time: new Date().toLocaleTimeString() }, ...prev].slice(0, 10));
        } catch (err) {
          const elapsed = Math.round(performance.now() - startTime);
          setError({ message: err.message, elapsed });
          setHistory(prev => [{ method, url, status: 'ERR', time: new Date().toLocaleTimeString() }, ...prev].slice(0, 10));
        } finally {
          setLoading(false);
        }
      };

      const formatData = (data) => {
        if (typeof data === 'string') return data;
        try { return JSON.stringify(data, null, 2); } catch { return String(data); }
      };

      const bodyDisabled = method === 'GET' || method === 'DELETE';

      return (
        <div className="max-w-6xl mx-auto p-4 md:p-8">
          <header className="mb-6">
            <h1 className="text-3xl font-bold text-slate-800">🚀 API 테스터</h1>
            <p className="text-slate-500 mt-1">서버 API 호출을 간편하게 테스트하세요</p>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Request Panel */}
            <div className="lg:col-span-2 space-y-4">
              <Card>
                <h2 className="text-lg font-semibold text-slate-700 mb-4">요청 (Request)</h2>

                <div className="flex gap-2 mb-4">
                  <div className="w-32">
                    <Select
                      value={method}
                      onChange={e => setMethod(e.target.value)}
                      options={METHODS}
                    />
                  </div>
                  <div className="flex-1">
                    <Input
                      value={url}
                      onChange={e => setUrl(e.target.value)}
                      placeholder="/api/hello"
                    />
                  </div>
                  <Button
                    onClick={sendRequest}
                    disabled={loading || !url}
                    className="min-w-[90px]"
                  >
                    {loading ? '전송중...' : '전송'}
                  </Button>
                </div>

                <div className="flex flex-wrap gap-2 mb-4">
                  <span className="text-xs text-slate-500 self-center mr-1">프리셋:</span>
                  {PRESET_ENDPOINTS.map(p => (
                    <Button
                      key={p.label}
                      variant="ghost"
                      size="sm"
                      onClick={() => setUrl(p.url)}
                      className="border border-slate-200"
                    >
                      {p.label}
                    </Button>
                  ))}
                </div>

                <Textarea
                  label="헤더 (JSON)"
                  value={headers}
                  onChange={e => setHeaders(e.target.value)}
                  rows={4}
                  className="mb-4"
                />

                <Textarea
                  label={`본문 (Body)${bodyDisabled ? ' — GET/DELETE에서는 사용 안됨' : ''}`}
                  value={body}
                  onChange={e => setBody(e.target.value)}
                  placeholder={'{\n  "name": "henry"\n}'}
                  rows={6}
                />
              </Card>

              <Card>
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-lg font-semibold text-slate-700">응답 (Response)</h2>
                  {response && (
                    <div className="flex gap-2 items-center">
                      <Badge color={statusColor(response.status)}>
                        {response.status} {response.statusText}
                      </Badge>
                      <Badge color="slate">{response.elapsed}ms</Badge>
                    </div>
                  )}
                  {error && <Badge color="red">에러 · {error.elapsed}ms</Badge>}
                </div>

                {!response && !error && !loading && (
                  <div className="text-center py-12 text-slate-400">
                    <div className="text-4xl mb-2">📭</div>
                    <p>아직 요청이 없습니다</p>
                  </div>
                )}

                {loading && (
                  <div className="text-center py-12 text-slate-400">
                    <div className="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-2"></div>
                    <p>요청 전송 중...</p>
                  </div>
                )}

                {error && (
                  <div className="bg-red-50 border border-red-200 rounded-lg p-4">
                    <p className="text-red-700 font-medium mb-1">요청 실패</p>
                    <pre className="text-sm text-red-600 whitespace-pre-wrap break-all">{error.message}</pre>
                    <p className="text-xs text-red-500 mt-2">
                      ⚠️ 서버가 실행 중인지, CORS 설정이 허용되어 있는지 확인하세요.
                    </p>
                  </div>
                )}

                {response && (
                  <div className="space-y-4">
                    <div>
                      <h3 className="text-sm font-semibold text-slate-600 mb-2">본문</h3>
                      <pre className="bg-slate-900 text-green-300 rounded-lg p-4 overflow-auto text-sm max-h-96">{formatData(response.data)}</pre>
                    </div>
                    <details className="bg-slate-50 rounded-lg p-3">
                      <summary className="cursor-pointer text-sm font-semibold text-slate-600">
                        응답 헤더 ({Object.keys(response.headers).length})
                      </summary>
                      <pre className="mt-2 text-xs text-slate-700 whitespace-pre-wrap">{formatData(response.headers)}</pre>
                    </details>
                  </div>
                )}
              </Card>
            </div>

            {/* History Panel */}
            <div className="lg:col-span-1">
              <Card>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-lg font-semibold text-slate-700">히스토리</h2>
                  {history.length > 0 && (
                    <Button variant="ghost" size="sm" onClick={() => setHistory([])}>
                      지우기
                    </Button>
                  )}
                </div>
                {history.length === 0 ? (
                  <p className="text-sm text-slate-400 text-center py-6">기록 없음</p>
                ) : (
                  <ul className="space-y-2">
                    {history.map((h, i) => (
                      <li
                        key={i}
                        className="p-2 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer text-sm"
                        onClick={() => { setMethod(h.method); setUrl(h.url); }}
                      >
                        <div className="flex justify-between items-center mb-1">
                          <Badge color={h.status === 'ERR' ? 'red' : statusColor(h.status)}>
                            {h.method}
                          </Badge>
                          <span className="text-xs text-slate-400">{h.time}</span>
                        </div>
                        <div className="text-slate-700 truncate">{h.url}</div>
                        <div className="text-xs text-slate-500">상태: {h.status}</div>
                      </li>
                    ))}
                  </ul>
                )}
              </Card>
            </div>
          </div>

          <footer className="mt-8 text-center text-xs text-slate-400">
            상대 경로(`/api/...`)는 현재 오리진으로 요청되며, 전체 URL(`http://...`)도 사용 가능합니다.
          </footer>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================

    function App() {
      return <ApiTester />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
