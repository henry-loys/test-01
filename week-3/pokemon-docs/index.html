<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포켓몬 도감</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out both;
    }
    @keyframes pulseSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-soft {
      animation: pulseSoft 1.5s ease-in-out infinite;
    }
    .card-hover {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .card-hover:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.25);
    }
    /* Subtle background pattern */
    body {
      background-image: radial-gradient(circle at 20% 20%, rgba(239, 68, 68, 0.08), transparent 40%),
                        radial-gradient(circle at 80% 60%, rgba(59, 130, 246, 0.08), transparent 40%);
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    // ========================================
    // 🌐 API 상수
    // ========================================
    const API_BASE_URL = 'https://pokeapi.co/api/v2';
    const PAGE_SIZE = 20;

    // ========================================
    // 🈶 한글 타입 매핑 테이블
    // ========================================
    const TYPE_KO = {
      normal: '노말',
      fire: '불꽃',
      water: '물',
      electric: '전기',
      grass: '풀',
      ice: '얼음',
      fighting: '격투',
      poison: '독',
      ground: '땅',
      flying: '비행',
      psychic: '에스퍼',
      bug: '벌레',
      rock: '바위',
      ghost: '고스트',
      dragon: '드래곤',
      dark: '악',
      steel: '강철',
      fairy: '페어리',
    };

    // ========================================
    // 🎨 Type Color Mapping (한글 타입명 기준)
    // ========================================
    const TYPE_STYLES = {
      '노말':   'bg-gray-400 text-white ring-gray-500/40',
      '불꽃':   'bg-orange-500 text-white ring-orange-600/40',
      '물':     'bg-blue-500 text-white ring-blue-600/40',
      '전기':   'bg-yellow-400 text-yellow-900 ring-yellow-500/40',
      '풀':     'bg-green-500 text-white ring-green-600/40',
      '얼음':   'bg-cyan-300 text-cyan-900 ring-cyan-500/40',
      '격투':   'bg-red-700 text-white ring-red-800/40',
      '독':     'bg-purple-500 text-white ring-purple-600/40',
      '땅':     'bg-amber-600 text-white ring-amber-700/40',
      '비행':   'bg-indigo-400 text-white ring-indigo-500/40',
      '에스퍼': 'bg-pink-500 text-white ring-pink-600/40',
      '벌레':   'bg-lime-500 text-white ring-lime-600/40',
      '바위':   'bg-yellow-700 text-white ring-yellow-800/40',
      '고스트': 'bg-indigo-700 text-white ring-indigo-800/40',
      '드래곤': 'bg-violet-700 text-white ring-violet-800/40',
      '악':     'bg-slate-700 text-white ring-slate-800/40',
      '강철':   'bg-slate-400 text-white ring-slate-500/40',
      '페어리': 'bg-pink-300 text-pink-900 ring-pink-500/40',
    };

    const getTypeStyle = (type) =>
      TYPE_STYLES[type] || 'bg-slate-300 text-slate-800 ring-slate-400/40';

    // ========================================
    // 🛠 Utility Helpers
    // ========================================
    const formatId = (id) => `#${String(id).padStart(3, '0')}`;

    // URL에서 id 추출 (".../pokemon/25/" → 25)
    const extractIdFromUrl = (url) => {
      const match = url.match(/\/(\d+)\/?$/);
      return match ? Number(match[1]) : null;
    };

    // ========================================
    // 🔌 PokeAPI 연동 + 모듈 레벨 캐시
    // ========================================
    // 같은 포켓몬을 여러 번 불러오지 않도록 모듈 레벨에 보관한다.
    const pokemonCache = new Map(); // id → normalized pokemon

    // species에서 한글 이름 추출
    const extractKoreanName = (speciesData, fallback) => {
      const koEntry = speciesData?.names?.find(
        (n) => n.language?.name === 'ko'
      );
      return koEntry?.name || fallback;
    };

    // PokeAPI 응답을 우리가 쓰는 구조로 정규화
    const normalizePokemon = (detail, species) => {
      const id = detail.id;
      const nameEn = detail.name;
      const nameKo = extractKoreanName(species, nameEn);
      const types = detail.types.map(
        (t) => TYPE_KO[t.type.name] || t.type.name
      );
      const artwork =
        detail.sprites?.other?.['official-artwork']?.front_default ||
        detail.sprites?.front_default ||
        null;

      return {
        id,
        name: nameKo,
        nameEn,
        types,
        height: detail.height / 10,  // decimeters → meters
        weight: detail.weight / 10,  // hectograms → kilograms
        image: artwork,
      };
    };

    // 단일 포켓몬 상세 조회 (id 또는 영문 이름)
    const fetchPokemonByKey = async (key) => {
      // id일 경우 캐시 선조회
      if (typeof key === 'number' && pokemonCache.has(key)) {
        return pokemonCache.get(key);
      }

      const detailRes = await fetch(`${API_BASE_URL}/pokemon/${key}`);
      if (!detailRes.ok) {
        throw new Error(`포켓몬을 찾을 수 없습니다. (${detailRes.status})`);
      }
      const detail = await detailRes.json();

      // species는 404날 수도 있지만 기본 포켓몬은 대부분 OK
      let species = null;
      try {
        const speciesRes = await fetch(
          `${API_BASE_URL}/pokemon-species/${detail.id}`
        );
        if (speciesRes.ok) species = await speciesRes.json();
      } catch (_) {
        /* species는 실패해도 fallback 처리 */
      }

      const normalized = normalizePokemon(detail, species);
      pokemonCache.set(normalized.id, normalized);
      return normalized;
    };

    // 페이징 목록 조회 (offset/limit) → 정규화된 포켓몬 배열
    const fetchPokemonPage = async (offset, limit) => {
      const listRes = await fetch(
        `${API_BASE_URL}/pokemon?limit=${limit}&offset=${offset}`
      );
      if (!listRes.ok) {
        throw new Error(`목록을 불러올 수 없습니다. (${listRes.status})`);
      }
      const listJson = await listRes.json();
      const total = listJson.count;

      // 각 아이템의 id 추출 후 캐시 확인 → 미캐시만 상세 호출
      const items = listJson.results.map((r) => ({
        id: extractIdFromUrl(r.url),
        nameEn: r.name,
      }));

      const detailed = await Promise.all(
        items.map(async ({ id, nameEn }) => {
          if (pokemonCache.has(id)) return pokemonCache.get(id);
          try {
            return await fetchPokemonByKey(id);
          } catch (e) {
            // 일부 포켓몬이 실패해도 리스트 전체를 날리지 않도록 null 반환
            return null;
          }
        })
      );

      return {
        items: detailed.filter(Boolean),
        total,
      };
    };

    // ========================================
    // 🎨 Design System Components
    // ========================================
    const Input = ({ value, onChange, placeholder, className = '', ...rest }) => (
      <div className={`relative ${className}`}>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          className="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            strokeLinecap="round"
            strokeLinejoin="round"
            strokeWidth={2}
            d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"
          />
        </svg>
        <input
          type="text"
          value={value}
          onChange={onChange}
          placeholder={placeholder}
          className="w-full pl-12 pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-4 focus:ring-red-100 focus:border-red-400 transition-all text-slate-800 placeholder-slate-400"
          aria-label="포켓몬 검색"
          {...rest}
        />
      </div>
    );

    const Badge = ({ children, className = '' }) => (
      <span
        className={`inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ring-2 ring-inset ${className}`}
      >
        {children}
      </span>
    );

    const Card = ({ children, className = '' }) => (
      <div
        className={`bg-white rounded-3xl shadow-md overflow-hidden card-hover ${className}`}
      >
        {children}
      </div>
    );

    const Button = ({ children, onClick, variant = 'primary', className = '', disabled }) => {
      const base =
        'inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl font-bold text-sm shadow-sm transition-all focus:outline-none focus:ring-4 disabled:opacity-50 disabled:cursor-not-allowed';
      const variants = {
        primary:
          'bg-gradient-to-b from-red-500 to-red-600 text-white hover:from-red-600 hover:to-red-700 focus:ring-red-200',
        secondary:
          'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 focus:ring-slate-200',
      };
      return (
        <button
          type="button"
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${className}`}
        >
          {children}
        </button>
      );
    };

    // ========================================
    // 🧩 SkeletonCard Component
    // ========================================
    const SkeletonCard = () => (
      <div className="bg-white rounded-3xl shadow-md overflow-hidden animate-pulse-soft">
        <div className="bg-slate-200 h-56"></div>
        <div className="p-5 space-y-3">
          <div className="h-5 bg-slate-200 rounded w-2/3"></div>
          <div className="flex gap-2">
            <div className="h-5 w-14 bg-slate-200 rounded-full"></div>
            <div className="h-5 w-14 bg-slate-200 rounded-full"></div>
          </div>
          <div className="pt-3 border-t border-slate-100 grid grid-cols-2 gap-3">
            <div className="h-4 bg-slate-200 rounded"></div>
            <div className="h-4 bg-slate-200 rounded"></div>
          </div>
        </div>
      </div>
    );

    // ========================================
    // 🧩 PokemonCard Component
    // ========================================
    const PokemonCard = ({ pokemon }) => {
      const [imgError, setImgError] = useState(false);
      const hasImg = pokemon.image && !imgError;

      return (
        <Card className="animate-fade-in">
          <div className="relative bg-gradient-to-br from-slate-100 to-slate-200 h-56 flex items-center justify-center">
            <span className="absolute top-4 right-4 text-xs font-bold text-slate-500 bg-white/80 backdrop-blur px-3 py-1 rounded-full">
              {formatId(pokemon.id)}
            </span>
            {hasImg ? (
              <img
                src={pokemon.image}
                alt={pokemon.name}
                className="w-40 h-40 object-contain drop-shadow-lg"
                onError={() => setImgError(true)}
                loading="lazy"
              />
            ) : (
              <div className="w-40 h-40 flex items-center justify-center text-slate-400 text-sm">
                이미지 없음
              </div>
            )}
          </div>

          <div className="p-5">
            <div className="mb-2">
              <h3 className="text-xl font-extrabold text-slate-800 leading-tight">
                {pokemon.name}
              </h3>
              <p className="text-xs text-slate-400 font-medium capitalize mt-0.5">
                {pokemon.nameEn}
              </p>
            </div>

            <div className="flex flex-wrap gap-2 mb-4">
              {pokemon.types.map((type) => (
                <Badge key={type} className={getTypeStyle(type)}>
                  {type}
                </Badge>
              ))}
            </div>

            <div className="grid grid-cols-2 gap-3 pt-3 border-t border-slate-100">
              <div>
                <p className="text-xs text-slate-400 font-medium mb-0.5">키</p>
                <p className="text-sm font-bold text-slate-700">
                  {pokemon.height} m
                </p>
              </div>
              <div>
                <p className="text-xs text-slate-400 font-medium mb-0.5">몸무게</p>
                <p className="text-sm font-bold text-slate-700">
                  {pokemon.weight} kg
                </p>
              </div>
            </div>
          </div>
        </Card>
      );
    };

    // ========================================
    // 🧩 EmptyState Component
    // ========================================
    const EmptyState = ({ query }) => (
      <div className="col-span-full flex flex-col items-center justify-center py-20 text-center">
        <div className="w-24 h-24 rounded-full bg-slate-100 flex items-center justify-center mb-5">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            className="w-12 h-12 text-slate-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              strokeLinecap="round"
              strokeLinejoin="round"
              strokeWidth={1.8}
              d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </div>
        <p className="text-lg font-bold text-slate-700 mb-1">결과 없음</p>
        <p className="text-sm text-slate-500">
          {query
            ? <>'<span className="font-semibold text-slate-700">{query}</span>'에 해당하는 포켓몬을 찾을 수 없습니다.</>
            : '검색어를 입력해주세요.'}
        </p>
      </div>
    );

    // ========================================
    // 🧩 ErrorState Component
    // ========================================
    const ErrorState = ({ message, onRetry }) => (
      <div className="col-span-full flex flex-col items-center justify-center py-16 text-center">
        <div className="w-20 h-20 rounded-full bg-red-50 flex items-center justify-center mb-4">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            className="w-10 h-10 text-red-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              strokeLinecap="round"
              strokeLinejoin="round"
              strokeWidth={1.8}
              d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"
            />
          </svg>
        </div>
        <p className="text-lg font-bold text-slate-700 mb-1">문제가 발생했습니다</p>
        <p className="text-sm text-slate-500 mb-5">{message}</p>
        {onRetry && (
          <Button onClick={onRetry}>다시 시도</Button>
        )}
      </div>
    );

    // ========================================
    // 🧩 Header Component
    // ========================================
    const Header = ({ query, onQueryChange, totalCount, resultCount, loadedCount }) => (
      <header className="mb-8">
        <div className="flex items-center gap-3 mb-2">
          <div className="w-10 h-10 rounded-full bg-gradient-to-b from-red-500 to-red-600 relative overflow-hidden shadow-lg">
            <div className="absolute inset-x-0 top-1/2 h-1 bg-slate-900"></div>
            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full ring-2 ring-slate-900"></div>
          </div>
          <h1 className="text-3xl sm:text-4xl font-black text-slate-800 tracking-tight">
            포켓몬 도감
          </h1>
        </div>
        <p className="text-slate-500 mb-6">
          이름(한글/영문) 또는 번호로 검색하세요
          {totalCount > 0 && (
            <> · 전체 <span className="font-semibold text-slate-700">{totalCount}</span>마리 중 <span className="font-semibold text-slate-700">{loadedCount}</span>마리 로드됨</>
          )}
        </p>

        <Input
          value={query}
          onChange={(e) => onQueryChange(e.target.value)}
          placeholder="포켓몬 이름 또는 번호 (예: 피카츄, pikachu, 25)"
        />

        {query && (
          <p className="mt-3 text-sm text-slate-500">
            검색 결과 <span className="font-bold text-red-500">{resultCount}</span>마리
          </p>
        )}
      </header>
    );

    // ========================================
    // 🪝 useDebounce 훅
    // ========================================
    const useDebounce = (value, delay = 300) => {
      const [debounced, setDebounced] = useState(value);
      useEffect(() => {
        const t = setTimeout(() => setDebounced(value), delay);
        return () => clearTimeout(t);
      }, [value, delay]);
      return debounced;
    };

    // ========================================
    // 📄 PokedexPage (메인 페이지)
    // ========================================
    const PokedexPage = () => {
      // 목록 상태
      const [pokemons, setPokemons] = useState([]);       // 지금까지 로드된 포켓몬
      const [total, setTotal] = useState(0);              // 서버의 전체 개수
      const [offset, setOffset] = useState(0);            // 다음 페이지 offset
      const [loadingList, setLoadingList] = useState(false);
      const [listError, setListError] = useState(null);

      // 검색 상태
      const [query, setQuery] = useState('');
      const debouncedQuery = useDebounce(query, 300);
      const [searchResult, setSearchResult] = useState(null); // 직접 조회 결과(단일 포켓몬)
      const [searching, setSearching] = useState(false);

      // 한 페이지 로드
      const loadPage = useCallback(async (nextOffset) => {
        setLoadingList(true);
        setListError(null);
        try {
          const { items, total: serverTotal } = await fetchPokemonPage(
            nextOffset,
            PAGE_SIZE
          );
          setTotal(serverTotal);
          setPokemons((prev) => {
            // 중복 제거 (id 기준)
            const seen = new Set(prev.map((p) => p.id));
            const merged = [...prev];
            items.forEach((p) => {
              if (!seen.has(p.id)) {
                merged.push(p);
                seen.add(p.id);
              }
            });
            return merged;
          });
          setOffset(nextOffset + PAGE_SIZE);
        } catch (e) {
          setListError(e.message || '알 수 없는 오류');
        } finally {
          setLoadingList(false);
        }
      }, []);

      // 최초 로드
      useEffect(() => {
        loadPage(0);
        // eslint-disable-next-line
      }, []);

      // 검색: 디바운스된 쿼리 → 로컬 필터 + 서버 직접 조회 시도
      useEffect(() => {
        const q = debouncedQuery.trim().toLowerCase();
        if (!q) {
          setSearchResult(null);
          setSearching(false);
          return;
        }

        // 번호이거나 영문 소문자만으로 구성된 경우 서버 직접 조회 시도
        const isNumeric = /^\d+$/.test(q);
        const isEnName = /^[a-z0-9-]+$/.test(q);

        if (!isNumeric && !isEnName) {
          // 한글 등은 로컬 필터만 사용
          setSearchResult(null);
          return;
        }

        let cancelled = false;
        setSearching(true);
        (async () => {
          try {
            const key = isNumeric ? Number(q) : q;
            const found = await fetchPokemonByKey(key);
            if (cancelled) return;
            setSearchResult(found);
            // 목록에 없는 경우 목록에도 추가 (UX상 통일)
            setPokemons((prev) => {
              if (prev.some((p) => p.id === found.id)) return prev;
              return [...prev, found];
            });
          } catch (_) {
            if (!cancelled) setSearchResult(null);
          } finally {
            if (!cancelled) setSearching(false);
          }
        })();

        return () => {
          cancelled = true;
        };
      }, [debouncedQuery]);

      // 화면에 보여줄 목록 계산
      const displayed = useMemo(() => {
        const q = debouncedQuery.trim().toLowerCase();
        if (!q) {
          // id 오름차순 정렬로 안정적인 표시
          return [...pokemons].sort((a, b) => a.id - b.id);
        }
        const locallyFiltered = pokemons.filter(
          (p) =>
            p.name.toLowerCase().includes(q) ||
            p.nameEn.toLowerCase().includes(q) ||
            String(p.id).includes(q)
        );

        // 서버 직접 조회 결과가 있고 로컬에 없으면 합치기
        if (
          searchResult &&
          !locallyFiltered.some((p) => p.id === searchResult.id)
        ) {
          locallyFiltered.push(searchResult);
        }

        return locallyFiltered.sort((a, b) => a.id - b.id);
      }, [pokemons, debouncedQuery, searchResult]);

      // 무한 스크롤 sentinel
      const sentinelRef = useRef(null);
      const hasMore = total === 0 || offset < total;
      const canAutoLoad = !query.trim(); // 검색 중엔 자동 로드 중지

      useEffect(() => {
        if (!canAutoLoad) return;
        if (!hasMore) return;
        const el = sentinelRef.current;
        if (!el) return;

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting && !loadingList) {
                loadPage(offset);
              }
            });
          },
          { rootMargin: '400px' }
        );
        observer.observe(el);
        return () => observer.disconnect();
      }, [canAutoLoad, hasMore, loadingList, offset, loadPage]);

      // 재시도
      const handleRetry = () => loadPage(offset);

      // 메인 영역 렌더 결정
      const showInitialLoading = loadingList && pokemons.length === 0 && !listError;
      const showInitialError = listError && pokemons.length === 0;

      return (
        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
          <Header
            query={query}
            onQueryChange={setQuery}
            totalCount={total}
            resultCount={displayed.length}
            loadedCount={pokemons.length}
          />

          <main>
            {showInitialError ? (
              <ErrorState message={listError} onRetry={handleRetry} />
            ) : showInitialLoading ? (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                {Array.from({ length: 8 }).map((_, i) => (
                  <SkeletonCard key={i} />
                ))}
              </div>
            ) : displayed.length === 0 && !searching ? (
              <EmptyState query={query} />
            ) : (
              <>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                  {displayed.map((pokemon) => (
                    <PokemonCard key={pokemon.id} pokemon={pokemon} />
                  ))}
                  {/* 페이징 로딩 중이면 스켈레톤 추가 표시 */}
                  {loadingList &&
                    pokemons.length > 0 &&
                    Array.from({ length: 4 }).map((_, i) => (
                      <SkeletonCard key={`skeleton-more-${i}`} />
                    ))}
                </div>

                {/* 페이징 에러 (이미 목록은 있음) */}
                {listError && pokemons.length > 0 && (
                  <div className="mt-8">
                    <ErrorState message={listError} onRetry={handleRetry} />
                  </div>
                )}

                {/* 무한 스크롤 sentinel + 더 보기 버튼 (검색 미중일 때만) */}
                {canAutoLoad && hasMore && !listError && (
                  <div
                    ref={sentinelRef}
                    className="mt-10 flex justify-center"
                  >
                    <Button
                      variant="secondary"
                      onClick={() => loadPage(offset)}
                      disabled={loadingList}
                    >
                      {loadingList ? '불러오는 중...' : '더 보기'}
                    </Button>
                  </div>
                )}

                {/* 검색 중 스피너 */}
                {searching && (
                  <p className="mt-6 text-center text-sm text-slate-400">
                    검색 중...
                  </p>
                )}

                {/* 모두 로드 완료 */}
                {canAutoLoad && !hasMore && pokemons.length > 0 && (
                  <p className="mt-10 text-center text-xs text-slate-400">
                    모든 포켓몬을 불러왔습니다 · 총 {pokemons.length}마리
                  </p>
                )}
              </>
            )}
          </main>

          <footer className="mt-16 text-center text-xs text-slate-400">
            데이터 출처 · <a href="https://pokeapi.co/" target="_blank" rel="noopener noreferrer" className="underline hover:text-slate-600">PokeAPI</a>
          </footer>
        </div>
      );
    };

    // ========================================
    // 🚀 App Root
    // ========================================
    const App = () => <PokedexPage />;

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
