<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APOD — NASA Astronomy Picture of the Day</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }
    * { -webkit-tap-highlight-color: transparent; }

    .font-serif-ed {
      font-family: "New York", "Times New Roman", Georgia, serif;
    }

    /* Space radial overlay */
    .space-bg::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 10%, rgba(168, 85, 247, 0.14), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(124, 58, 237, 0.10), transparent 50%),
        radial-gradient(circle at 50% 90%, rgba(139, 92, 246, 0.08), transparent 55%);
      z-index: 0;
    }

    /* Cinematic fade in */
    @keyframes cineFadeUp {
      0%   { opacity: 0; transform: translateY(24px); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0);    filter: blur(0); }
    }
    .cine-in {
      animation: cineFadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .cine-delay-1 { animation-delay: 0.15s; }
    .cine-delay-2 { animation-delay: 0.30s; }
    .cine-delay-3 { animation-delay: 0.45s; }
    .cine-delay-4 { animation-delay: 0.60s; }

    /* Drop cap (magazine) */
    .dropcap::first-letter {
      float: left;
      font-family: "New York", "Times New Roman", Georgia, serif;
      font-size: 5.25rem;
      line-height: 0.85;
      padding: 0.5rem 0.75rem 0 0;
      color: #c084fc;
      font-weight: 600;
    }

    /* Kerning / tracking */
    .tracking-label { letter-spacing: 0.3em; }

    /* Hero gradient overlay */
    .hero-gradient {
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.25) 35%,
        rgba(0,0,0,0.65) 70%,
        rgba(0,0,0,0.95) 100%
      );
    }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 42px; height: 42px;
      border-radius: 9999px;
      border: 2px solid rgba(168, 85, 247, 0.18);
      border-top-color: #c084fc;
      animation: spin 0.9s linear infinite;
    }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0% { background-position: -600px 0; }
      100% { background-position: 600px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #0a0a0a 0%, #181028 50%, #0a0a0a 100%);
      background-size: 1200px 100%;
      animation: shimmer 2.1s infinite linear;
    }

    /* Glow hover */
    .glow-hover { transition: box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1); }
    .glow-hover:hover {
      box-shadow: 0 0 60px rgba(168, 85, 247, 0.35), 0 0 120px rgba(168, 85, 247, 0.15);
      transform: translateY(-2px);
    }

    /* Button primary */
    .btn-primary {
      background: linear-gradient(180deg, #a855f7 0%, #7c3aed 100%);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .btn-primary:hover {
      box-shadow: 0 0 40px rgba(168, 85, 247, 0.55);
      transform: translateY(-1px);
    }

    /* Native date input dark */
    input[type="date"] {
      color-scheme: dark;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1) sepia(1) saturate(4) hue-rotate(240deg);
      cursor: pointer;
    }

    /* Hide scrollbar on horizontal gallery mobile */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Subtle grain */
    .grain::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      z-index: 1;
    }
  </style>
</head>
<body class="space-bg grain">
  <div id="root" class="relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo, useRef } = React;

    // ========================================
    // 🔧 Constants & Utilities
    // ========================================
    const NASA_API_KEY = "SdACiMheX0DuxoDGhS8hMiup2p0yhMRlPx1bQ4a7";
    const NASA_APOD_URL = "https://api.nasa.gov/planetary/apod";

    const pad = (n) => String(n).padStart(2, "0");
    const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const todayISO = () => toISO(new Date());

    const formatKoreanDate = (iso) => {
      if (!iso) return "";
      const [y, m, d] = iso.split("-");
      return `${y}년 ${parseInt(m, 10)}월 ${parseInt(d, 10)}일`;
    };

    const formatWeekday = (iso) => {
      if (!iso) return "";
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      const d = new Date(iso);
      return days[d.getDay()];
    };

    const minusDaysISO = (iso, n) => {
      const d = new Date(iso);
      d.setDate(d.getDate() - n);
      return toISO(d);
    };

    const translateError = (status) => {
      if (status === 400) return "잘못된 요청입니다. 날짜 형식을 확인해주세요.";
      if (status === 401 || status === 403) return "API 키가 유효하지 않습니다. 관리자에게 문의해주세요.";
      if (status === 404) return "해당 날짜의 APOD 데이터를 찾을 수 없습니다.";
      if (status === 429) return "요청이 너무 많습니다. 잠시 후 다시 시도해주세요.";
      if (status >= 500) return "NASA 서버에 문제가 발생했습니다. 잠시 후 다시 시도해주세요.";
      return "알 수 없는 오류가 발생했습니다.";
    };

    // ========================================
    // 🌐 Translation Utility (MyMemory API)
    // ========================================
    const translationCache = new Map();
    const MYMEMORY_URL = "https://api.mymemory.translated.net/get";
    const CHUNK_MAX_LEN = 380;

    // Split text into sentences, then group into chunks <= CHUNK_MAX_LEN
    const splitIntoChunks = (text) => {
      if (!text) return [];
      // Split on sentence terminators followed by whitespace, keeping the terminator.
      const sentences = text.match(/[^.!?]+[.!?]+(?:\s+|$)|[^.!?]+$/g) || [text];
      const chunks = [];
      let current = "";
      for (const raw of sentences) {
        const s = raw.trim();
        if (!s) continue;
        if (s.length >= CHUNK_MAX_LEN) {
          // Sentence itself exceeds chunk — hard split by length at word boundaries.
          if (current) { chunks.push(current); current = ""; }
          let remaining = s;
          while (remaining.length > CHUNK_MAX_LEN) {
            let cut = remaining.lastIndexOf(" ", CHUNK_MAX_LEN);
            if (cut < 100) cut = CHUNK_MAX_LEN;
            chunks.push(remaining.slice(0, cut).trim());
            remaining = remaining.slice(cut).trim();
          }
          if (remaining) current = remaining;
          continue;
        }
        if ((current + " " + s).trim().length > CHUNK_MAX_LEN) {
          if (current) chunks.push(current);
          current = s;
        } else {
          current = current ? current + " " + s : s;
        }
      }
      if (current) chunks.push(current);
      return chunks;
    };

    const translateChunk = async (chunk) => {
      const url = `${MYMEMORY_URL}?q=${encodeURIComponent(chunk)}&langpair=en|ko`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`MyMemory HTTP ${res.status}`);
      const data = await res.json();
      const translated = data && data.responseData && data.responseData.translatedText;
      if (!translated) throw new Error("MyMemory: empty translation");
      // MyMemory sometimes returns HTML-escaped entities
      return translated
        .replace(/&quot;/g, '"')
        .replace(/&#39;/g, "'")
        .replace(/&amp;/g, "&")
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">");
    };

    const translateToKorean = async (text) => {
      if (!text) return "";
      if (translationCache.has(text)) return translationCache.get(text);
      const chunks = splitIntoChunks(text);
      if (chunks.length === 0) return text;
      const results = await Promise.all(chunks.map(translateChunk));
      const joined = results.join(" ").replace(/\s+/g, " ").trim();
      translationCache.set(text, joined);
      return joined;
    };

    // ========================================
    // 🎨 Design System Components
    // ========================================
    function Button({ variant = "primary", size = "md", className = "", children, ...props }) {
      const sizes = {
        sm: "px-4 py-2 text-xs",
        md: "px-6 py-3 text-sm",
        lg: "px-8 py-4 text-base",
      };
      const variants = {
        primary: "btn-primary text-white font-medium rounded-full",
        ghost: "text-white/80 hover:text-white border border-white/15 hover:border-white/40 rounded-full backdrop-blur-xl bg-white/5 transition-all duration-500",
        danger: "bg-red-600 hover:bg-red-500 text-white rounded-full transition",
        icon: "w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 border border-white/10 text-white/80 hover:text-white transition",
      };
      return (
        <button
          {...props}
          className={`${variants[variant]} ${variant !== "icon" ? sizes[size] : ""} tracking-wide disabled:opacity-40 disabled:cursor-not-allowed ${className}`}
        >
          {children}
        </button>
      );
    }

    function Card({ className = "", children }) {
      return (
        <div className={`bg-white/[0.03] backdrop-blur-xl border border-white/10 rounded-2xl ${className}`}>
          {children}
        </div>
      );
    }

    function Badge({ children, className = "" }) {
      return (
        <span className={`inline-flex items-center gap-2 px-3 py-1 rounded-full text-[10px] tracking-label uppercase font-medium bg-purple-500/15 text-purple-300 border border-purple-400/30 ${className}`}>
          {children}
        </span>
      );
    }

    function SectionLabel({ children, className = "" }) {
      return (
        <div className={`text-[11px] uppercase tracking-label text-purple-300/90 font-medium ${className}`}>
          {children}
        </div>
      );
    }

    function Spinner({ label }) {
      return (
        <div className="flex flex-col items-center justify-center gap-4 py-16">
          <div className="spinner" />
          {label && <div className="text-white/60 text-xs uppercase tracking-label">{label}</div>}
        </div>
      );
    }

    function ErrorState({ message, onRetry }) {
      return (
        <div className="flex flex-col items-center justify-center gap-6 py-20 text-center px-6">
          <div className="w-14 h-14 rounded-full border border-purple-400/40 flex items-center justify-center text-purple-300 text-2xl">!</div>
          <div>
            <div className="text-[11px] uppercase tracking-label text-purple-300 mb-2">문제가 발생했습니다</div>
            <div className="text-white/80 text-lg max-w-md">{message}</div>
          </div>
          {onRetry && (
            <Button variant="ghost" onClick={onRetry}>다시 시도</Button>
          )}
        </div>
      );
    }

    function Modal({ isOpen, onClose, children }) {
      useEffect(() => {
        if (!isOpen) return;
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        document.addEventListener("keydown", handler);
        document.body.style.overflow = "hidden";
        return () => {
          document.removeEventListener("keydown", handler);
          document.body.style.overflow = "";
        };
      }, [isOpen, onClose]);

      if (!isOpen) return null;
      return (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4 sm:p-8"
          onClick={onClose}
          role="dialog"
          aria-modal="true"
        >
          <button
            onClick={onClose}
            aria-label="닫기"
            className="absolute top-6 right-6 w-11 h-11 rounded-full bg-white/10 hover:bg-white/20 border border-white/20 text-white text-xl flex items-center justify-center transition"
          >
            ×
          </button>
          <div
            className="relative max-w-[95vw] max-h-[92vh] w-full h-full flex items-center justify-center"
            onClick={(e) => e.stopPropagation()}
          >
            {children}
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 App-specific Components
    // ========================================
    function HeroMedia({ item, onOpen }) {
      if (!item) return null;
      if (item.media_type === "video") {
        return (
          <iframe
            src={item.url}
            title={item.title}
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowFullScreen
            className="absolute inset-0 w-full h-full"
          />
        );
      }
      return (
        <img
          src={item.url}
          alt={item.title}
          onClick={onOpen}
          className="absolute inset-0 w-full h-full object-cover cursor-zoom-in transition duration-[1200ms] hover:scale-[1.02]"
          loading="eager"
        />
      );
    }

    function Hero({ item, onOpen, translatedTitle, titleTranslating, titleFailed }) {
      if (!item) return null;
      const showTranslated = translatedTitle && !titleFailed;
      return (
        <section className="relative w-full h-[92vh] min-h-[600px] overflow-hidden">
          <div className="absolute inset-0 bg-[#0a0a0a]">
            <HeroMedia item={item} onOpen={onOpen} />
          </div>
          <div className="absolute inset-0 hero-gradient pointer-events-none" />
          <div className="absolute inset-0 flex items-end">
            <div className="w-full max-w-7xl mx-auto px-6 sm:px-10 pb-16 sm:pb-24">
              <div className="flex items-center gap-3 mb-6 cine-in">
                <SectionLabel>NASA · Astronomy Picture of the Day</SectionLabel>
                {titleTranslating && (
                  <span className="text-[10px] uppercase tracking-label text-purple-300/80">번역 중…</span>
                )}
              </div>
              <h1 className="cine-in cine-delay-1 text-5xl sm:text-7xl lg:text-8xl font-semibold tracking-tight leading-[0.95] max-w-5xl">
                {showTranslated ? translatedTitle : item.title}
              </h1>
              {showTranslated && (
                <div className="cine-in cine-delay-2 mt-4 text-white/50 text-sm sm:text-base italic font-serif-ed max-w-4xl">
                  {item.title}
                </div>
              )}
              <div className="cine-in cine-delay-2 mt-8 flex flex-wrap items-center gap-4 text-white/70">
                <div className="text-sm uppercase tracking-label">{formatKoreanDate(item.date)} · {formatWeekday(item.date)}요일</div>
                <span className="text-white/20">—</span>
                <Badge>
                  <span className="w-1.5 h-1.5 rounded-full bg-purple-400" />
                  {item.media_type === "video" ? "Video" : "Image"}
                </Badge>
                {item.copyright && (
                  <>
                    <span className="text-white/20">—</span>
                    <div className="text-xs text-white/50">© {item.copyright.trim()}</div>
                  </>
                )}
              </div>
            </div>
          </div>
          {/* Scroll hint */}
          <div className="absolute bottom-6 left-1/2 -translate-x-1/2 text-white/40 text-[10px] uppercase tracking-label cine-in cine-delay-4">
            ↓ Scroll
          </div>
        </section>
      );
    }

    function MetaBar({ item }) {
      if (!item) return null;
      return (
        <div className="border-y border-white/10">
          <div className="max-w-7xl mx-auto px-6 sm:px-10 py-6 flex flex-wrap items-center gap-x-12 gap-y-4 text-xs">
            <div>
              <div className="text-white/40 uppercase tracking-label mb-1">Date</div>
              <div className="text-white/90">{formatKoreanDate(item.date)}</div>
            </div>
            <div>
              <div className="text-white/40 uppercase tracking-label mb-1">Media</div>
              <div className="text-white/90 capitalize">{item.media_type}</div>
            </div>
            {item.copyright && (
              <div>
                <div className="text-white/40 uppercase tracking-label mb-1">Copyright</div>
                <div className="text-white/90">{item.copyright.trim()}</div>
              </div>
            )}
            <div>
              <div className="text-white/40 uppercase tracking-label mb-1">Source</div>
              <div className="text-white/90">NASA APOD API</div>
            </div>
          </div>
        </div>
      );
    }

    function Article({ item, onOpenHD, translatedText, translating, translationFailed, viewMode, onToggleView }) {
      if (!item) return null;
      const canToggle = translatedText && !translationFailed;
      const isKorean = canToggle && viewMode === "ko";

      return (
        <section className="max-w-3xl mx-auto px-6 sm:px-10 py-24 sm:py-32">
          <div className="mb-10 flex items-start justify-between gap-4 flex-wrap">
            <div>
              <SectionLabel className="mb-4">The Story</SectionLabel>
              <div className="h-px w-16 bg-purple-400/60" />
            </div>
            <div className="flex items-center gap-3">
              {translationFailed && (
                <span className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[10px] tracking-label uppercase font-medium bg-amber-500/10 text-amber-300 border border-amber-400/30">
                  <span className="w-1.5 h-1.5 rounded-full bg-amber-400" />
                  번역 실패 · 원문 표시
                </span>
              )}
              {canToggle && (
                <div className="inline-flex rounded-full border border-white/15 bg-white/5 backdrop-blur-xl p-1 text-[11px] uppercase tracking-label">
                  <button
                    type="button"
                    onClick={() => onToggleView("ko")}
                    className={`px-3 py-1.5 rounded-full transition ${isKorean ? "bg-purple-500/80 text-white" : "text-white/60 hover:text-white"}`}
                  >
                    번역
                  </button>
                  <button
                    type="button"
                    onClick={() => onToggleView("en")}
                    className={`px-3 py-1.5 rounded-full transition ${!isKorean ? "bg-purple-500/80 text-white" : "text-white/60 hover:text-white"}`}
                  >
                    원문
                  </button>
                </div>
              )}
            </div>
          </div>

          {translating ? (
            <div className="space-y-4">
              <div className="text-purple-300/80 text-sm uppercase tracking-label flex items-center gap-3">
                <span className="inline-block w-2 h-2 rounded-full bg-purple-400 animate-pulse" />
                우주의 이야기를 한국어로 옮기는 중…
              </div>
              <div className="space-y-3">
                <div className="h-5 rounded skeleton w-full" />
                <div className="h-5 rounded skeleton w-[95%]" />
                <div className="h-5 rounded skeleton w-[88%]" />
                <div className="h-5 rounded skeleton w-[92%]" />
                <div className="h-5 rounded skeleton w-[70%]" />
              </div>
            </div>
          ) : isKorean ? (
            <p className="text-lg sm:text-xl leading-[1.95] text-white/90" style={{ fontFamily: '-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif' }}>
              {translatedText}
            </p>
          ) : (
            <p className="dropcap font-serif-ed text-xl sm:text-2xl leading-[1.75] text-white/85">
              {item.explanation}
            </p>
          )}

          <div className="mt-14 flex flex-wrap items-center gap-3">
            {item.media_type === "image" ? (
              <Button variant="primary" onClick={onOpenHD}>
                HD 원본 보기 →
              </Button>
            ) : (
              <Button variant="primary" onClick={() => window.open(item.url, "_blank")}>
                비디오 열기 ↗
              </Button>
            )}
            <Button variant="ghost" onClick={() => {
              const el = document.getElementById("picker");
              if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
            }}>
              다른 날짜 보기
            </Button>
          </div>
        </section>
      );
    }

    function DatePicker({ selectedDate, onSelectDate, onToday, onRandom, loading }) {
      const max = todayISO();
      return (
        <section id="picker" className="border-t border-white/10 bg-gradient-to-b from-black to-[#0a0514]">
          <div className="max-w-7xl mx-auto px-6 sm:px-10 py-24">
            <div className="mb-12">
              <SectionLabel className="mb-4">Explore</SectionLabel>
              <h2 className="text-4xl sm:text-6xl font-semibold tracking-tight">
                시간을 거슬러 <span className="text-purple-300">우주</span>를 보세요.
              </h2>
              <p className="mt-6 text-white/60 text-lg max-w-xl">
                1995년 6월 16일부터 매일 공개된 NASA의 천체 사진. 원하는 날짜를 선택하거나 무작위로 탐험해 보세요.
              </p>
            </div>

            <Card className="p-6 sm:p-10">
              <div className="flex flex-col md:flex-row md:items-end gap-6">
                <div className="flex-1">
                  <label htmlFor="date" className="block text-[11px] uppercase tracking-label text-white/50 mb-3">
                    Pick a date
                  </label>
                  <input
                    id="date"
                    type="date"
                    value={selectedDate}
                    max={max}
                    min="1995-06-16"
                    disabled={loading}
                    onChange={(e) => onSelectDate(e.target.value)}
                    className="w-full bg-black/50 border border-white/15 rounded-2xl px-5 py-4 text-white text-lg focus:outline-none focus:border-purple-400/60 focus:ring-2 focus:ring-purple-500/30 transition"
                  />
                </div>
                <div className="flex flex-wrap gap-3">
                  <Button variant="ghost" onClick={onToday} disabled={loading}>오늘</Button>
                  <Button variant="primary" onClick={onRandom} disabled={loading}>랜덤 ✦</Button>
                </div>
              </div>
            </Card>
          </div>
        </section>
      );
    }

    function ArchiveGallery({ items, loading, onSelectDate, currentDate }) {
      return (
        <section className="border-t border-white/10">
          <div className="max-w-7xl mx-auto px-6 sm:px-10 py-24">
            <div className="flex items-end justify-between mb-10">
              <div>
                <SectionLabel className="mb-4">Archive</SectionLabel>
                <h2 className="text-3xl sm:text-5xl font-semibold tracking-tight">지난 7일</h2>
              </div>
              <div className="text-white/40 text-xs uppercase tracking-label hidden sm:block">
                클릭하여 이동
              </div>
            </div>

            {loading ? (
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-4">
                {Array.from({ length: 7 }).map((_, i) => (
                  <div key={i} className="aspect-[3/4] rounded-xl skeleton" />
                ))}
              </div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-7 gap-4">
                {items.map((it) => {
                  const isActive = it.date === currentDate;
                  return (
                    <button
                      key={it.date}
                      onClick={() => onSelectDate(it.date)}
                      aria-label={`${formatKoreanDate(it.date)} APOD 보기`}
                      className={`group relative aspect-[3/4] rounded-xl overflow-hidden glow-hover text-left border ${
                        isActive ? "border-purple-400/80 shadow-[0_0_40px_rgba(168,85,247,0.4)]" : "border-white/10"
                      }`}
                    >
                      {it.media_type === "image" ? (
                        <img
                          src={it.url}
                          alt={it.title}
                          loading="lazy"
                          className="absolute inset-0 w-full h-full object-cover transition duration-700 group-hover:scale-110"
                        />
                      ) : (
                        <div className="absolute inset-0 bg-gradient-to-br from-purple-900/60 to-black flex items-center justify-center">
                          <div className="text-center">
                            <div className="text-3xl mb-2">▶</div>
                            <div className="text-[10px] uppercase tracking-label text-purple-200">Video</div>
                          </div>
                        </div>
                      )}
                      <div className="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent" />
                      <div className="absolute inset-x-0 bottom-0 p-3">
                        <div className="text-[10px] uppercase tracking-label text-purple-300 mb-1">{it.date}</div>
                        <div className="text-white text-sm font-medium line-clamp-2">{it.title}</div>
                      </div>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        </section>
      );
    }

    function SiteHeader() {
      return (
        <header className="fixed top-0 inset-x-0 z-40 backdrop-blur-xl bg-black/40 border-b border-white/5">
          <div className="max-w-7xl mx-auto px-6 sm:px-10 h-14 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-2 h-2 rounded-full bg-purple-400 shadow-[0_0_12px_rgba(168,85,247,0.8)]" />
              <div className="text-sm font-semibold tracking-tight">APOD</div>
              <div className="text-[10px] uppercase tracking-label text-white/40 hidden sm:block">by NASA</div>
            </div>
            <nav className="text-[11px] uppercase tracking-label text-white/60 flex gap-6">
              <a href="#picker" className="hover:text-white transition">탐색</a>
              <a href="https://apod.nasa.gov/apod/" target="_blank" rel="noreferrer" className="hover:text-white transition">원본 ↗</a>
            </nav>
          </div>
        </header>
      );
    }

    function SiteFooter() {
      return (
        <footer className="border-t border-white/10 py-16">
          <div className="max-w-7xl mx-auto px-6 sm:px-10 text-center">
            <SectionLabel className="mb-4">End of Transmission</SectionLabel>
            <div className="text-white/70 text-sm">
              데이터 제공: <a href="https://api.nasa.gov/" target="_blank" rel="noreferrer" className="text-purple-300 hover:text-purple-200 underline underline-offset-4">api.nasa.gov</a>
            </div>
            <div className="text-white/30 text-xs mt-3">
              © NASA Astronomy Picture of the Day · UI by APOD Viewer
            </div>
          </div>
        </footer>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [selectedDate, setSelectedDate] = useState(todayISO());
      const [apod, setApod] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const [archive, setArchive] = useState([]);
      const [archiveLoading, setArchiveLoading] = useState(true);

      const [lightbox, setLightbox] = useState(false);

      // Translation state
      const [translatedExplanation, setTranslatedExplanation] = useState("");
      const [translatingBody, setTranslatingBody] = useState(false);
      const [bodyTranslationFailed, setBodyTranslationFailed] = useState(false);

      const [translatedTitle, setTranslatedTitle] = useState("");
      const [translatingTitle, setTranslatingTitle] = useState(false);
      const [titleTranslationFailed, setTitleTranslationFailed] = useState(false);

      const [viewMode, setViewMode] = useState("ko"); // "ko" | "en"

      // Translate whenever apod changes
      useEffect(() => {
        if (!apod) return;
        let cancelled = false;

        // Reset state for new item
        setTranslatedExplanation("");
        setBodyTranslationFailed(false);
        setTranslatedTitle("");
        setTitleTranslationFailed(false);
        setViewMode("ko");

        // Translate explanation
        if (apod.explanation) {
          setTranslatingBody(true);
          translateToKorean(apod.explanation)
            .then((ko) => {
              if (cancelled) return;
              setTranslatedExplanation(ko);
            })
            .catch(() => {
              if (cancelled) return;
              setBodyTranslationFailed(true);
              setViewMode("en");
            })
            .finally(() => {
              if (!cancelled) setTranslatingBody(false);
            });
        }

        // Translate title
        if (apod.title) {
          setTranslatingTitle(true);
          translateToKorean(apod.title)
            .then((ko) => {
              if (cancelled) return;
              setTranslatedTitle(ko);
            })
            .catch(() => {
              if (cancelled) return;
              setTitleTranslationFailed(true);
            })
            .finally(() => {
              if (!cancelled) setTranslatingTitle(false);
            });
        }

        return () => { cancelled = true; };
      }, [apod]);

      // Fetch APOD for a specific date
      const fetchApodByDate = useCallback(async (date) => {
        setLoading(true);
        setError(null);
        try {
          const url = `${NASA_APOD_URL}?api_key=${NASA_API_KEY}&date=${date}&thumbs=true`;
          const res = await fetch(url);
          if (!res.ok) throw { status: res.status };
          const data = await res.json();
          setApod(data);
          setSelectedDate(data.date || date);
        } catch (err) {
          const msg = err && err.status
            ? translateError(err.status)
            : "네트워크 연결을 확인해주세요.";
          setError(msg);
        } finally {
          setLoading(false);
        }
      }, []);

      // Random APOD
      const fetchRandom = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          const url = `${NASA_APOD_URL}?api_key=${NASA_API_KEY}&count=1&thumbs=true`;
          const res = await fetch(url);
          if (!res.ok) throw { status: res.status };
          const data = await res.json();
          const item = Array.isArray(data) ? data[0] : data;
          setApod(item);
          if (item && item.date) setSelectedDate(item.date);
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (err) {
          const msg = err && err.status
            ? translateError(err.status)
            : "네트워크 연결을 확인해주세요.";
          setError(msg);
        } finally {
          setLoading(false);
        }
      }, []);

      // Fetch last 7 days archive
      const fetchArchive = useCallback(async () => {
        setArchiveLoading(true);
        try {
          const end = todayISO();
          const start = minusDaysISO(end, 6);
          const url = `${NASA_APOD_URL}?api_key=${NASA_API_KEY}&start_date=${start}&end_date=${end}&thumbs=true`;
          const res = await fetch(url);
          if (!res.ok) throw { status: res.status };
          const data = await res.json();
          // Normalize: if video, use thumbnail_url when available
          const normalized = (Array.isArray(data) ? data : [data]).map((it) => ({
            ...it,
            url: it.media_type === "video" && it.thumbnail_url ? it.thumbnail_url : it.url,
            media_type: it.media_type,
          }));
          // Newest first
          normalized.sort((a, b) => (a.date < b.date ? 1 : -1));
          setArchive(normalized);
        } catch (err) {
          // Silently fail archive; it's optional
          setArchive([]);
        } finally {
          setArchiveLoading(false);
        }
      }, []);

      // Initial load
      useEffect(() => {
        fetchApodByDate(todayISO());
        fetchArchive();
      }, [fetchApodByDate, fetchArchive]);

      const handleSelectDate = (date) => {
        if (!date) return;
        fetchApodByDate(date);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handleToday = () => {
        handleSelectDate(todayISO());
      };

      const openHD = () => {
        if (apod && apod.media_type === "image") setLightbox(true);
      };

      return (
        <div className="min-h-screen relative">
          <SiteHeader />

          <main className="pt-14">
            {loading && !apod && (
              <div className="h-[92vh] min-h-[600px] flex items-center justify-center">
                <Spinner label="Loading cosmos…" />
              </div>
            )}

            {error && !loading && (
              <div className="h-[92vh] min-h-[600px] flex items-center justify-center">
                <ErrorState message={error} onRetry={() => fetchApodByDate(selectedDate)} />
              </div>
            )}

            {!loading && !error && apod && (
              <>
                <div key={apod.date || apod.title}>
                  <Hero
                    item={apod}
                    onOpen={openHD}
                    translatedTitle={translatedTitle}
                    titleTranslating={translatingTitle}
                    titleFailed={titleTranslationFailed}
                  />
                  <MetaBar item={apod} />
                  <Article
                    item={apod}
                    onOpenHD={openHD}
                    translatedText={translatedExplanation}
                    translating={translatingBody}
                    translationFailed={bodyTranslationFailed}
                    viewMode={viewMode}
                    onToggleView={setViewMode}
                  />
                </div>
              </>
            )}

            {loading && apod && (
              <div className="py-8 flex justify-center">
                <Spinner label="Fetching…" />
              </div>
            )}

            <DatePicker
              selectedDate={selectedDate}
              onSelectDate={handleSelectDate}
              onToday={handleToday}
              onRandom={fetchRandom}
              loading={loading}
            />

            <ArchiveGallery
              items={archive}
              loading={archiveLoading}
              onSelectDate={handleSelectDate}
              currentDate={apod && apod.date}
            />
          </main>

          <SiteFooter />

          <Modal isOpen={lightbox} onClose={() => setLightbox(false)}>
            {apod && apod.media_type === "image" && (
              <div className="flex flex-col items-center gap-4 w-full h-full">
                <img
                  src={apod.hdurl || apod.url}
                  alt={apod.title}
                  className="max-w-full max-h-[85vh] object-contain rounded-lg shadow-[0_0_80px_rgba(168,85,247,0.35)]"
                />
                <div className="text-center">
                  <div className="text-white text-lg font-medium">{apod.title}</div>
                  <div className="text-white/50 text-xs uppercase tracking-label mt-1">
                    {formatKoreanDate(apod.date)} · HD 원본
                  </div>
                </div>
              </div>
            )}
          </Modal>
        </div>
      );
    }

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
