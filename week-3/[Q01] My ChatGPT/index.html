<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persona Chat — AI 페르소나 채팅</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg:          #000000;
      --bg-elev-1:   #0b0b0d;
      --bg-elev-2:   #141418;
      --bg-elev-3:   #1c1c1f;
      --text:        #f5f5f7;
      --text-muted:  #a1a1a6;
      --text-dim:    #6e6e73;
      --border:      rgba(255, 255, 255, 0.08);
      --border-soft: rgba(255, 255, 255, 0.05);
      --purple-1:    #8B5CF6;
      --purple-2:    #A78BFA;
      --purple-3:    #C4B5FD;
      --purple-soft: rgba(139, 92, 246, 0.14);
      --purple-line: rgba(139, 92, 246, 0.35);
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                   "Helvetica Neue", Helvetica, "Apple SD Gothic Neo", "Pretendard",
                   "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--bg);
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .apple-nav {
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      background-color: rgba(0, 0, 0, 0.72);
    }

    .scroll-clean::-webkit-scrollbar { width: 6px; height: 6px; }
    .scroll-clean::-webkit-scrollbar-thumb {
      background: rgba(167, 139, 250, 0.35);
      border-radius: 999px;
    }
    .scroll-clean::-webkit-scrollbar-track { background: transparent; }

    @keyframes bubbleIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .bubble-in { animation: bubbleIn 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) both; }

    @keyframes blink {
      0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-2px); }
    }
    .dot { animation: blink 1.2s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    .text-gradient {
      background: linear-gradient(90deg, #A78BFA 0%, #E9D5FF 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .btn-glow {
      box-shadow: 0 14px 40px -12px rgba(139, 92, 246, 0.55),
                  0 0 0 1px rgba(255,255,255,0.02);
    }

    input[type="range"].purple-slider {
      -webkit-appearance: none; appearance: none;
      height: 4px; border-radius: 999px;
      background: linear-gradient(90deg, #A78BFA var(--val,50%), rgba(255,255,255,0.12) var(--val,50%));
      outline: none;
    }
    input[type="range"].purple-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 999px;
      background: #0b0b0d; border: 2px solid #A78BFA;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.5);
      cursor: pointer;
    }

    .chip { transition: all 0.18s ease; }
    .chip:hover { transform: translateY(-1px); }

    .hero-glow::before {
      content: "";
      position: absolute;
      inset: -20% -10% auto -10%;
      height: 520px;
      background: radial-gradient(60% 60% at 50% 40%, rgba(139,92,246,0.28), rgba(0,0,0,0) 70%);
      pointer-events: none; z-index: -1;
    }

    /* Roulette spin shake */
    @keyframes spinShake {
      0%,100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-2px) scale(1.01); }
      50% { transform: translateY(1px) scale(0.99); }
      75% { transform: translateY(-1px) scale(1.02); }
    }
    .spin-shake { animation: spinShake 0.15s linear infinite; }

    /* Result pop-in */
    @keyframes resultPop {
      0%   { opacity: 0; transform: scale(0.85); filter: blur(4px); }
      60%  { opacity: 1; transform: scale(1.05); filter: blur(0); }
      100% { transform: scale(1); }
    }
    .result-pop { animation: resultPop 0.5s cubic-bezier(0.2,0.8,0.2,1.2) both; }

    /* Sparkles */
    @keyframes sparkle {
      0%,100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .sparkle { animation: sparkle 1.2s ease-in-out infinite; }
  </style>
</head>
<body class="bg-black text-[#f5f5f7]">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ========================================
    // 🎨 Design System
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, className = '', children, type = 'button', ...rest }) {
      const base = 'inline-flex items-center justify-center font-medium rounded-full transition-all duration-200 disabled:opacity-40 disabled:cursor-not-allowed active:scale-[0.98]';
      const sizes = { sm: 'px-4 py-1.5 text-sm', md: 'px-5 py-2.5 text-[15px]', lg: 'px-7 py-3 text-base' };
      const variants = {
        primary:   'bg-[#8B5CF6] text-white hover:bg-[#7C4DEF] btn-glow',
        secondary: 'bg-[#1c1c1f] text-[#f5f5f7] border border-white/10 hover:border-white/20',
        ghost:     'bg-transparent text-[#A78BFA] hover:bg-[rgba(139,92,246,0.14)]',
        danger:    'bg-[rgba(239,68,68,0.12)] text-[#F87171] hover:bg-[rgba(239,68,68,0.2)]',
      };
      return (
        <button type={type} disabled={disabled} onClick={onClick}
          className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...rest}>
          {children}
        </button>
      );
    }

    function Input({ label, value, onChange, placeholder, type = 'text', className = '', autoFocus, onKeyDown }) {
      return (
        <label className={`block ${className}`}>
          {label && <span className="block text-[13px] font-medium text-[#a1a1a6] mb-1.5">{label}</span>}
          <input
            type={type} value={value} onChange={onChange} placeholder={placeholder}
            autoFocus={autoFocus} onKeyDown={onKeyDown}
            className="w-full px-4 py-2.5 text-[15px] bg-[#1c1c1f] text-[#f5f5f7] border border-white/10 rounded-xl
                       focus:outline-none focus:border-[#A78BFA] focus:ring-2 focus:ring-[rgba(139,92,246,0.25)]
                       transition-all placeholder:text-[#6e6e73]"
          />
        </label>
      );
    }

    function Textarea({ label, value, onChange, placeholder, rows = 3, className = '' }) {
      return (
        <label className={`block ${className}`}>
          {label && <span className="block text-[13px] font-medium text-[#a1a1a6] mb-1.5">{label}</span>}
          <textarea
            value={value} onChange={onChange} placeholder={placeholder} rows={rows}
            className="w-full px-4 py-2.5 text-[15px] bg-[#1c1c1f] text-[#f5f5f7] border border-white/10 rounded-xl resize-none
                       focus:outline-none focus:border-[#A78BFA] focus:ring-2 focus:ring-[rgba(139,92,246,0.25)]
                       transition-all placeholder:text-[#6e6e73]"
          />
        </label>
      );
    }

    function Card({ className = '', children }) {
      return <div className={`bg-[#141418] rounded-3xl border border-white/10 shadow-[0_1px_2px_rgba(0,0,0,0.4)] ${className}`}>{children}</div>;
    }

    function Badge({ children, className = '' }) {
      return (
        <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
                          bg-[rgba(139,92,246,0.14)] text-[#C4B5FD] border border-[rgba(139,92,246,0.3)] ${className}`}>
          {children}
        </span>
      );
    }

    function Chip({ active, onClick, children }) {
      return (
        <button onClick={onClick}
          className={`chip px-4 py-2 rounded-full text-sm font-medium border
            ${active ? 'bg-[#8B5CF6] text-white border-[#8B5CF6]'
                    : 'bg-[#1c1c1f] text-[#d1d1d6] border-white/10 hover:border-[#A78BFA] hover:text-[#f5f5f7]'}`}>
          {children}
        </button>
      );
    }

    function Modal({ open, onClose, children, maxWidth = 'max-w-md' }) {
      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          <div className="absolute inset-0 bg-black/75 backdrop-blur-sm" onClick={onClose}></div>
          <div className={`relative w-full ${maxWidth} bg-[#0b0b0d] border border-white/10 rounded-3xl shadow-2xl
                          overflow-hidden animate-[bubbleIn_0.3s_ease]`}>
            {children}
          </div>
        </div>
      );
    }

    const API_BASE_URL = '/api';

    async function callChatAPI({ persona, message, history }) {
      const res = await fetch(`${API_BASE_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona, message, history }),
      });
      const json = await res.json().catch(() => ({ success: false, message: '응답을 해석할 수 없습니다.' }));
      if (!res.ok || !json.success) throw new Error(json.message || `요청 실패 (${res.status})`);
      return json.data;
    }

    async function callQuizAPI({ persona }) {
      const res = await fetch(`${API_BASE_URL}/quiz`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona }),
      });
      const json = await res.json().catch(() => ({ success: false, message: '응답을 해석할 수 없습니다.' }));
      if (!res.ok || !json.success) throw new Error(json.message || `요청 실패 (${res.status})`);
      return json.data;

    // ========================================
    // 🎲 Roulette Modal
    // ========================================
    function RouletteModal({ open, onClose, onPick }) {
      const [phase, setPhase] = useState('idle'); // idle | spinning | result
      const [displayed, setDisplayed] = useState(PRESET_PROFILES[0]);
      const [result, setResult] = useState(null);
      const timerRef = useRef(null);

      useEffect(() => {
        if (!open) {
          setPhase('idle'); setResult(null);
          if (timerRef.current) { clearTimeout(timerRef.current); timerRef.current = null; }
        }
      }, [open]);

      const spin = () => {
        setPhase('spinning'); setResult(null);
        const winner = PRESET_PROFILES[Math.floor(Math.random() * PRESET_PROFILES.length)];
        let i = Math.floor(Math.random() * PRESET_PROFILES.length);
        let delay = 60;
        const startedAt = Date.now();
        const tick = () => {
          setDisplayed(PRESET_PROFILES[i % PRESET_PROFILES.length]);
          i++;
          const elapsed = Date.now() - startedAt;
          if (elapsed < 1500) {
            delay = 60;
          } else if (elapsed < 2600) {
            delay = Math.min(delay + 18, 220);
          } else {
            setDisplayed(winner);
            setResult(winner);
            setPhase('result');
            return;
          }
          timerRef.current = setTimeout(tick, delay);
        };
        tick();
      };

      if (!open) return null;

      return (
        <Modal open={open} onClose={phase === 'spinning' ? () => {} : onClose} maxWidth="max-w-lg">
          <div className="p-6 border-b border-white/10 flex items-center justify-between">
            <div>
              <div className="text-[11px] uppercase tracking-wider text-[#A78BFA] font-semibold">Roulette</div>
              <h2 className="text-xl font-semibold text-[#f5f5f7]">페르소나 룰렛</h2>
            </div>
            <button onClick={onClose} disabled={phase === 'spinning'}
              className="p-2 rounded-full hover:bg-white/10 text-[#a1a1a6] hover:text-white transition-colors disabled:opacity-30">✕</button>
          </div>

          <div className="p-6">
            <div className={`relative rounded-3xl p-8 text-center
                             bg-gradient-to-br from-[rgba(139,92,246,0.18)] to-[rgba(139,92,246,0.04)]
                             border border-[rgba(139,92,246,0.3)] ${phase === 'spinning' ? 'spin-shake' : ''}
                             ${phase === 'result' ? 'result-pop' : ''}`}>
              {phase === 'result' && (
                <>
                  <span className="absolute top-3 left-4 text-xl sparkle">✨</span>
                  <span className="absolute top-5 right-6 text-xl sparkle" style={{ animationDelay: '0.3s' }}>✨</span>
                  <span className="absolute bottom-4 left-8 text-lg sparkle" style={{ animationDelay: '0.6s' }}>✨</span>
                </>
              )}
              <div className="text-7xl mb-3 select-none">{displayed.emoji}</div>
              <div className="text-2xl font-semibold text-[#f5f5f7]">{displayed.name}</div>
              <div className="text-[13px] text-[#A78BFA] mt-1 font-medium">{displayed.title}</div>
              {phase === 'result' && (
                <p className="mt-3 text-sm text-[#a1a1a6] leading-relaxed">
                  {result.bio}
                </p>
              )}
            </div>

            <div className="mt-5 flex flex-wrap gap-2 justify-center">
              {phase === 'idle' && (
                <Button size="lg" onClick={spin}>🎲 룰렛 돌리기</Button>
              )}
              {phase === 'spinning' && (
                <Button size="lg" disabled>돌리는 중...</Button>
              )}
              {phase === 'result' && (
                <>
                  <Button size="lg" variant="secondary" onClick={spin}>🔁 다시 돌리기</Button>
                  <Button size="lg" onClick={() => onPick(result)}>이 페르소나로 시작 →</Button>
                </>
              )}
            </div>

            <div className="mt-6 pt-5 border-t border-white/5">
              <div className="text-[11px] uppercase tracking-wider text-[#6e6e73] mb-2 text-center">후보 10명</div>
              <div className="grid grid-cols-5 gap-2">
                {PRESET_PROFILES.map(p => (
                  <div key={p.id}
                    className={`p-2 rounded-xl text-center text-xl transition-all

                        ? 'bg-[rgba(139,92,246,0.25)] border border-[#A78BFA] scale-110'
                        : 'bg-[#1c1c1f] border border-white/5 opacity-60'}`}
                    title={`${p.name} · ${p.title}`}>
                    {p.emoji}
                  </div>
                ))}
              </div>
            </div>

    // ========================================
    // 🔐 Quiz Modal (프로필 변경 인증)
    // ========================================
    function QuizModal({ open, onClose, persona, onSuccess, intent }) {
      const [loading, setLoading] = useState(false);
      const [quiz, setQuiz] = useState(null);
      const [answer, setAnswer] = useState('');
      const [showHint, setShowHint] = useState(false);
      const [feedback, setFeedback] = useState(null); // { correct, message }
      const [attempts, setAttempts] = useState(0);

      const fetchQuiz = useCallback(async () => {
        setLoading(true); setQuiz(null); setAnswer(''); setFeedback(null); setShowHint(false);
        try {
          const data = await callQuizAPI({ persona });
          setQuiz(data);
        } catch (err) {
          setFeedback({ correct: false, message: `퀴즈를 가져오지 못했어요: ${err.message}` });
        } finally {
          setLoading(false);
        }
      }, [persona]);

      useEffect(() => {
        if (open) { setAttempts(0); fetchQuiz(); }
      }, [open, fetchQuiz]);

      const normalize = (s) => String(s || '').trim().toLowerCase().replace(/[\s.,!?'"·]/g, '');

      const check = () => {
        if (!quiz) return;
        const u = normalize(answer);
        const a = normalize(quiz.answer);
        if (!u) return;
        const correct = u === a || (a.length >= 2 && (u.includes(a) || a.includes(u) && Math.abs(u.length - a.length) <= 2));
        if (correct) {
          setFeedback({ correct: true, message: '정답이에요! 🎉' });
          setTimeout(() => onSuccess(), 900);
        } else {
          setAttempts(n => n + 1);
          setFeedback({ correct: false, message: '아쉬워요. 다시 시도해보세요.' });
        }
      };

      if (!open) return null;

      const intentLabel = intent === 'roulette' ? '룰렛 다시 돌리기' : '프로필 편집';

      return (
        <Modal open={open} onClose={onClose} maxWidth="max-w-md">
          <div className="p-6 border-b border-white/10 flex items-center justify-between">
            <div>
              <div className="text-[11px] uppercase tracking-wider text-[#A78BFA] font-semibold">🔐 Unlock</div>
              <h2 className="text-xl font-semibold text-[#f5f5f7]">{intentLabel} 인증</h2>
              <p className="text-[12px] text-[#a1a1a6] mt-1">
                {persona.name}이(가) 내는 문제를 맞히면 잠금이 풀려요.
              </p>
            </div>
            <button onClick={onClose}
              className="p-2 rounded-full hover:bg-white/10 text-[#a1a1a6] hover:text-white transition-colors">✕</button>
          </div>

          <div className="p-6 space-y-4">
            {loading && (
              <div className="flex items-center justify-center py-8 text-[#a1a1a6]">
                <span className="w-2 h-2 rounded-full bg-[#A78BFA] dot"></span>
                <span className="w-2 h-2 rounded-full bg-[#A78BFA] dot mx-1.5"></span>
                <span className="w-2 h-2 rounded-full bg-[#A78BFA] dot"></span>
                <span className="ml-3 text-sm">{persona.name}이(가) 문제를 생각 중이에요...</span>
              </div>
            )}

            {quiz && (
              <>
                <div className="bg-[rgba(139,92,246,0.08)] border border-[rgba(139,92,246,0.25)] rounded-2xl p-4">
                  <div className="flex gap-2 mb-2 items-center">
                    <span className="text-xl">{PRESET_BY_ID[persona.id]?.emoji || '💬'}</span>
                    <span className="text-[11px] font-medium text-[#C4B5FD] uppercase tracking-wider">문제</span>
                  </div>
                  <p className="text-[15px] text-[#f5f5f7] leading-relaxed whitespace-pre-wrap">
                    {quiz.question}
                  </p>
                </div>

                <Input
                  value={answer}
                  onChange={e => setAnswer(e.target.value)}
                  placeholder="정답을 입력하세요"
                  autoFocus
                  onKeyDown={(e) => { if (e.key === 'Enter') check(); }}
                />

                {showHint && quiz.hint && (
                  <div className="text-[13px] text-[#A78BFA] bg-[rgba(139,92,246,0.06)] border border-[rgba(139,92,246,0.2)] rounded-xl px-3 py-2">
                    💡 힌트: {quiz.hint}
                  </div>
                )}

                {feedback && !feedback.correct && (
                  <div className="text-[13px] text-[#F87171]">❌ {feedback.message}</div>
                )}
                {feedback && feedback.correct && (
                  <div className="text-[14px] text-emerald-400 font-medium">✅ {feedback.message}</div>
                )}

                <div className="flex gap-2 pt-1">
                  <Button onClick={check} disabled={!answer.trim()}>확인</Button>
                  {!showHint && quiz.hint && (
                    <Button variant="ghost" onClick={() => setShowHint(true)}>힌트 보기</Button>
                  )}
                  <Button variant="secondary" onClick={fetchQuiz}>🔄 다른 문제</Button>
                </div>

                {attempts >= 3 && (
                  <div className="text-[11px] text-[#6e6e73] pt-1">
                    Tip: 대소문자·띄어쓰기는 무시해요. 정답의 핵심 단어만 맞히면 OK.
                  </div>
                )}
              </>
            )}
          </div>
        </Modal>
      );
    }

                </div>
              )}

              <div className="bg-[rgba(139,92,246,0.1)] border border-[rgba(139,92,246,0.25)] rounded-2xl p-4 text-[13px] text-[#E9D5FF] leading-relaxed">
                <strong className="block mb-1 text-[#C4B5FD]">📌 프리뷰</strong>
                {local.name || 'AI'} · {PERSONALITY_OPTIONS.find(p => p.id === local.personality)?.label} ·{' '}
                {TONE_OPTIONS.find(t => t.id === local.tone)?.label}
                {local.expertise && <> · {local.expertise}</>}
              </div>
            </div>

            <div className="sticky bottom-0 bg-[#0b0b0d] border-t border-white/10 px-6 py-4 flex gap-3">
              <Button variant="secondary" className="flex-1" onClick={onClose}>취소</Button>
              <Button className="flex-1" onClick={save}>저장</Button>
            </div>
          </aside>
        </div>
      );
    }

    // ========================================
    // 🧩 Message Bubble
    // ========================================
    function MessageBubble({ msg, persona }) {
      // 시스템 메시지 (페르소나 전환 구분선 등)
      if (msg.role === 'system') {
        return (
          <div className="flex justify-center bubble-in py-1">
            <div className="text-[11px] text-[#a1a1a6] bg-white/[0.04] border border-white/10
                            px-3 py-1.5 rounded-full">
              {msg.content}
            </div>
          </div>
        );
      }

      const isUser = msg.role === 'user';
      const isError = msg.error === true;
      const time = new Date(msg.ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      // 메시지가 자체 페르소나 스냅샷을 가지면 우선 사용 (과거 대화 상대 유지)
      const msgPersona = msg.persona || persona;
      const avatarChar = msgPersona.emoji || (msgPersona.name || 'AI').slice(0, 1);

      return (
        <div className={`flex bubble-in gap-3 ${isUser ? 'justify-end' : 'justify-start'}`}>
          {!isUser && (
            <div className="flex-shrink-0 w-9 h-9 rounded-full bg-gradient-to-br from-[#8B5CF6] to-[#C4B5FD]
                            flex items-center justify-center text-black text-sm font-semibold shadow-md">
              {avatarChar}
            </div>
          )}
          <div className={`max-w-[78%] flex flex-col ${isUser ? 'items-end' : 'items-start'}`}>
            {!isUser && (
              <div className="text-[11px] text-[#6e6e73] mb-1 px-1">
                {msgPersona.name || 'AI'}{msgPersona.title ? ` · ${msgPersona.title}` : ''}
              </div>
            )}
            <div className={`px-4 py-3 rounded-2xl text-[15px] leading-relaxed whitespace-pre-wrap break-words
              ${isUser ? 'bg-[#8B5CF6] text-white rounded-br-md'
                : isError ? 'bg-[rgba(239,68,68,0.1)] border border-[rgba(239,68,68,0.3)] text-[#FCA5A5] rounded-bl-md'
                          : 'bg-[#1c1c1f] text-[#f5f5f7] border border-white/10 rounded-bl-md shadow-lg'}`}>
              {msg.content}
            </div>
            <div className="text-[10px] text-[#6e6e73] mt-1 px-1">{time}</div>
          </div>
          {isUser && (
            <div className="flex-shrink-0 w-9 h-9 rounded-full bg-[#1c1c1f] border border-white/10
                            flex items-center justify-center text-[#d1d1d6] text-sm font-medium">나</div>
          )}
        </div>
      );
    }

    function TypingBubble({ persona }) {
      const avatarChar = persona.emoji || (persona.name || 'AI').slice(0, 1);
      return (
        <div className="flex gap-3 bubble-in">
          <div className="flex-shrink-0 w-9 h-9 rounded-full bg-gradient-to-br from-[#8B5CF6] to-[#C4B5FD]
                          flex items-center justify-center text-black text-sm font-semibold shadow-md">
            {avatarChar}
          </div>
          <div className="bg-[#1c1c1f] border border-white/10 rounded-2xl rounded-bl-md px-5 py-4 shadow-lg flex items-center gap-1.5">
            <span className="w-2 h-2 rounded-full bg-[#A78BFA] dot"></span>
            <span className="w-2 h-2 rounded-full bg-[#A78BFA] dot"></span>
            <span className="w-2 h-2 rounded-full bg-[#A78BFA] dot"></span>
          </div>
        </div>
      );
    }

    // ========================================
    // 🧩 Chat Input
    // ========================================
    function ChatInput({ onSend, disabled }) {
      const [text, setText] = useState('');
      const taRef = useRef(null);

      const submit = () => {
        const t = text.trim();
        if (!t || disabled) return;
        onSend(t);
        setText('');
        if (taRef.current) taRef.current.style.height = 'auto';
      };

      const onKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
      };

      const onChange = (e) => {
        setText(e.target.value);
        if (taRef.current) {
          taRef.current.style.height = 'auto';
          taRef.current.style.height = Math.min(taRef.current.scrollHeight, 160) + 'px';
        }
      };

      return (
        <div className="border-t border-white/5 bg-black/80 backdrop-blur-xl">
          <div className="max-w-4xl mx-auto px-4 sm:px-6 py-4">
            <div className="flex items-end gap-2 bg-[#141418] border border-white/10 rounded-3xl px-4 py-2.5
                            shadow-[0_10px_40px_-15px_rgba(139,92,246,0.4)]
                            focus-within:border-[#A78BFA] focus-within:ring-4 focus-within:ring-[rgba(139,92,246,0.2)] transition-all">
              <textarea ref={taRef} rows={1} value={text} onChange={onChange} onKeyDown={onKeyDown}
                placeholder="메시지를 입력하세요.  (Enter: 전송 · Shift+Enter: 줄바꿈)"
                className="flex-1 bg-transparent resize-none outline-none text-[15px] py-1.5 max-h-40
                           text-[#f5f5f7] placeholder:text-[#6e6e73]"
                disabled={disabled} />
              <Button onClick={submit} disabled={!text.trim() || disabled} size="md" className="!px-4 !py-2">
                전송 →
              </Button>
            </div>
            <div className="text-center text-[11px] text-[#6e6e73] mt-2">
              답변은 OpenAI API + 설정된 프로필을 기반으로 생성돼요.
            </div>
          </div>
        </div>
      );
    }

    function SuggestionChips({ onPick, persona }) {
      const suggestions = useMemo(() => {
        const base = [
          '안녕! 너 자신을 소개해줘',
          '오늘 나에게 조언 하나 해줘',
          '너의 세계관에 대해 짧게 얘기해줘',
        ];
        if (persona.expertise) base.unshift(`${persona.expertise}에 대해 입문자에게 설명해줘`);
        return base;
      }, [persona.expertise]);

      return (
        <div className="flex flex-wrap justify-center gap-2 mt-6">
          {suggestions.map((s, i) => (
            <button key={i} onClick={() => onPick(s)}
              className="chip px-4 py-2 rounded-full text-[13px] text-[#d1d1d6]
                         bg-[#1c1c1f] border border-white/10 hover:border-[#A78BFA] hover:text-white">
              {s}
            </button>
          ))}
        </div>
      );
    }

    // ========================================
    // 📄 Chat Area
    // ========================================
    function ChatArea({ persona, messages, setMessages, isTyping, setIsTyping }) {
      const endRef = useRef(null);

      useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, isTyping]);

      const send = useCallback(async (text) => {
        const userMsg = { id: Date.now(), role: 'user', content: text, ts: Date.now() };
        setMessages(prev => [...prev, userMsg]);
        setIsTyping(true);
        try {
          const history = [...messages, userMsg].slice(-12)
            .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }))
            .slice(0, -1);
          const data = await callChatAPI({ persona, message: text, history });
          const personaSnapshot = {
            id: persona.id, name: persona.name, emoji: persona.emoji,
            title: persona.title, personality: persona.personality,
          };
          setMessages(prev => [...prev, {
            id: Date.now() + 1, role: 'ai',
            content: data.content || '(빈 응답)', ts: Date.now(),
            persona: personaSnapshot,
          }]);
        } catch (err) {
          const personaSnapshot = {
            id: persona.id, name: persona.name, emoji: persona.emoji,
            title: persona.title, personality: persona.personality,
          };
          setMessages(prev => [...prev, {
            id: Date.now() + 1, role: 'ai', error: true,
            content: `⚠️ 응답을 가져오지 못했어요.\n${err.message}`,
            ts: Date.now(), persona: personaSnapshot,
          }]);
        } finally {
          setIsTyping(false);
        }
      }, [persona, messages, setMessages, setIsTyping]);

      const isEmpty = messages.length === 0;
      const avatarChar = persona.emoji || (persona.name || 'AI').slice(0, 1);

      return (
        <div className="flex-1 flex flex-col min-h-0">
          <div id="chat" className="flex-1 overflow-y-auto scroll-clean">
            <div className="max-w-4xl mx-auto px-4 sm:px-6 py-8 space-y-5">
              {isEmpty ? (
                <div className="text-center py-16">
                  <div className="w-16 h-16 mx-auto rounded-full bg-gradient-to-br from-[#8B5CF6] to-[#C4B5FD]
                                  flex items-center justify-center text-black text-2xl font-semibold
                                  shadow-[0_10px_40px_-10px_rgba(139,92,246,0.6)]">
                    {avatarChar}
                  </div>
                  <h3 className="mt-5 text-2xl font-semibold tracking-tight text-[#f5f5f7]">
                    {persona.name || 'AI'}와의 대화를 시작해보세요
                  </h3>
                  <p className="mt-2 text-[15px] text-[#a1a1a6]">
                    {persona.title || PERSONALITY_OPTIONS.find(p => p.id === persona.personality)?.label}
                    {persona.expertise && <> · {persona.expertise}</>}
                  </p>
                  <SuggestionChips onPick={send} persona={persona} />
                </div>
              ) : (
                messages.map(msg => <MessageBubble key={msg.id} msg={msg} persona={persona} />)
              )}
              {isTyping && <TypingBubble persona={persona} />}
              <div ref={endRef}></div>
            </div>
          </div>
          <ChatInput onSend={send} disabled={isTyping} />
        </div>
      );
    }

    // ========================================
    // 🚀 App Root
    // ========================================
    const DEFAULT_PERSONA = {
      id: null,
      name: '보라',
      emoji: '💜',
      title: '',
      personality: 'friendly',
      tone: 'polite',
      expertise: '프론트엔드 개발',
      creativity: 0.65,
      bio: '',
      systemExtra: '',
    };

    function App() {
      const saved = loadState();
      const [persona, setPersona] = useState(saved?.persona || DEFAULT_PERSONA);
      const [messages, setMessages] = useState(saved?.messages || []);
      const [isTyping, setIsTyping] = useState(false);
      const [profileOpen, setProfileOpen] = useState(false);
      const [rouletteOpen, setRouletteOpen] = useState(false);
      const [quizOpen, setQuizOpen] = useState(false);
      const [quizIntent, setQuizIntent] = useState(null);
      const [showHero, setShowHero] = useState((saved?.messages?.length ?? 0) === 0);

      useEffect(() => { saveState({ persona, messages }); }, [persona, messages]);

      const isLocked = messages.length > 0;

      const requestRoulette = () => {
        if (isLocked) { setQuizIntent('roulette'); setQuizOpen(true); }
        else setRouletteOpen(true);
      };
      const requestProfile = () => {
        if (isLocked) { setQuizIntent('profile'); setQuizOpen(true); }
        else setProfileOpen(true);
      };
      const onQuizSuccess = () => {
        setQuizOpen(false);
        if (quizIntent === 'roulette') setRouletteOpen(true);
        else if (quizIntent === 'profile') setProfileOpen(true);
        setQuizIntent(null);
      };
      const onRoulettePick = (preset) => {
        const newPersona = { ...preset };
        // 이미 대화가 있다면 전환 시점을 시스템 메시지로 남긴다 (대화 상대 히스토리 보존)
        if (messages.length > 0) {
          setMessages(prev => [...prev, {
            id: Date.now(),
            role: 'system',
            content: `${newPersona.emoji} ${newPersona.name} · ${newPersona.title}(으)로 전환됨`,
            ts: Date.now(),
          }]);
        }
        setPersona(newPersona);
        setRouletteOpen(false);
        setShowHero(false);
        setTimeout(() => document.getElementById('chat')?.scrollIntoView({ behavior: 'smooth' }), 50);
      };
      const startWithCurrent = () => {
        setShowHero(false);
        setTimeout(() => document.getElementById('chat')?.scrollIntoView({ behavior: 'smooth' }), 50);
      };
      const resetConversation = () => {
        if (confirm('대화 기록을 모두 지울까요?')) {
          setMessages([]); setShowHero(true);
        }
      };

      const personalityLabel = PERSONALITY_OPTIONS.find(p => p.id === persona.personality);
      const toneLabel = TONE_OPTIONS.find(t => t.id === persona.tone);

      return (
        <div className="min-h-screen flex flex-col bg-black">
          <TopNav onOpenProfile={requestProfile} persona={persona} />

          {showHero && (
            <Hero persona={persona}
              onSpinRoulette={() => setRouletteOpen(true)}
              onStartChat={startWithCurrent} />
          )}

          {/* Persona summary strip — Hero가 없으면 상단 sticky로 고정 (룰렛/편집 상시 노출) */}
          <div className={!showHero ? 'sticky top-12 z-20 bg-black/85 backdrop-blur-xl border-b border-white/5' : ''}>
            <div className="max-w-4xl w-full mx-auto px-4 sm:px-6 py-2">
              <Card className="flex items-center gap-4 p-4">
              <div className="w-12 h-12 rounded-full bg-gradient-to-br from-[#8B5CF6] to-[#C4B5FD]
                              flex items-center justify-center text-black text-xl font-semibold flex-shrink-0">
                {persona.emoji || (persona.name || 'AI').slice(0, 1)}
              </div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="font-semibold text-[15px] text-[#f5f5f7]">{persona.name || 'AI'}</span>
                  {persona.title && <Badge>{persona.title}</Badge>}
                  {!persona.title && personalityLabel && (
                    <Badge>{personalityLabel.emoji} {personalityLabel.label}</Badge>
                  )}
                  {toneLabel && <Badge>{toneLabel.label}</Badge>}
                </div>
                <p className="text-[13px] text-[#a1a1a6] mt-1 truncate">
                  {persona.bio || persona.subtitle || '프로필을 편집해 나만의 AI를 완성하세요.'}
                </p>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0 flex-wrap justify-end">
                <Button size="sm" onClick={requestRoulette}>
                  {isLocked && '🔒 '}🎲 룰렛
                </Button>
                <Button size="sm" variant="secondary" onClick={requestProfile}>
                  {isLocked && '🔒 '}편집
                </Button>
                <Button size="sm" variant="ghost" onClick={resetConversation}>기록 지우기</Button>
              </div>
              </Card>
            </div>
          </div>

          <main className="flex-1 flex flex-col min-h-[60vh] mt-4">
            <ChatArea
              persona={persona}
              messages={messages}
              setMessages={setMessages}
              isTyping={isTyping}
              setIsTyping={setIsTyping} />
          </main>

          <footer className="text-center text-[11px] text-[#6e6e73] py-6">
            Persona Chat — Designed with an Apple-inspired aesthetic. Powered by OpenAI.
          </footer>

          <RouletteModal open={rouletteOpen}
            onClose={() => setRouletteOpen(false)}
            onPick={onRoulettePick} />

          <QuizModal open={quizOpen}
            onClose={() => { setQuizOpen(false); setQuizIntent(null); }}
            persona={persona}
            intent={quizIntent}
            onSuccess={onQuizSuccess} />

          <ProfilePanel open={profileOpen}
            onClose={() => setProfileOpen(false)}
            persona={persona} setPersona={setPersona} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
