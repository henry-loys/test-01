<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>하트 상담사 - 연애 상담 챗봇</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body, #root { height: 100%; }
    body {
      background: linear-gradient(135deg, #fff1f2 0%, #fce7f3 50%, #fef3c7 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    }
    /* Custom scrollbar */
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 3px; }
    .chat-scroll::-webkit-scrollbar-thumb:hover { background: #f9a8d4; }

    /* Fade-in animation for new messages */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.3s ease-out; }

    /* Pulse glow for status dot */
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    }
    .status-dot { animation: pulseGlow 2s infinite; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // ========================================
    // Constants & Data
    // ========================================
    const API_BASE_URL = '/api';
    const STORAGE_KEY = 'love-chat-history-v1';
    const COUNSELOR_NAME = '하트 상담사';
    const COUNSELOR_EMOJI = '💕';
    const ERROR_REPLY = '죄송해요, 잠시 문제가 생겼어요. 다시 시도해 주세요 💦';

    const QUICK_PROMPTS = [
      '썸인 것 같아요 😳',
      '헤어진 전 애인이 자꾸 생각나요',
      '고백하고 싶어요 💌',
      '짝사랑 중이에요',
    ];

    // ========================================
    // Helpers
    // ========================================
    const formatTime = (ts) => {
      const d = new Date(ts);
      const hh = d.getHours();
      const mm = String(d.getMinutes()).padStart(2, '0');
      const period = hh < 12 ? '오전' : '오후';
      const h12 = hh % 12 === 0 ? 12 : hh % 12;
      return `${period} ${h12}:${mm}`;
    };

    const makeMessage = (role, text) => ({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      role,
      text,
      ts: Date.now(),
    });

    const loadHistory = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        return null;
      } catch (e) {
        return null;
      }
    };

    const saveHistory = (messages) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
      } catch (e) {}
    };

    // ========================================
    // 🎨 Design System
    // ========================================
    function Button({ variant = 'primary', size = 'md', disabled, onClick, className = '', children, type = 'button', ariaLabel }) {
      const base = 'inline-flex items-center justify-center font-semibold rounded-full transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-rose-300 disabled:opacity-40 disabled:cursor-not-allowed';
      const sizes = {
        sm: 'px-3 py-1.5 text-xs',
        md: 'px-4 py-2 text-sm',
        lg: 'px-6 py-3 text-base',
      };
      const variants = {
        primary: 'bg-gradient-to-r from-rose-400 to-pink-500 text-white shadow-md hover:shadow-lg hover:from-rose-500 hover:to-pink-600 active:scale-95',
        secondary: 'bg-white text-rose-500 border border-rose-200 hover:bg-rose-50 active:scale-95',
        ghost: 'bg-transparent text-rose-500 hover:bg-rose-100/60',
        danger: 'bg-white text-rose-500 border border-rose-200 hover:bg-rose-50',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          onClick={onClick}
          aria-label={ariaLabel}
          className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}
        >
          {children}
        </button>
      );
    }

    function TextInput({ value, onChange, onKeyDown, placeholder, disabled, ariaLabel }) {
      return (
        <input
          type="text"
          value={value}
          onChange={(e) => onChange(e.target.value)}
          onKeyDown={onKeyDown}
          placeholder={placeholder}
          disabled={disabled}
          aria-label={ariaLabel}
          className="w-full px-4 py-3 text-sm bg-white/90 border border-rose-100 rounded-full shadow-sm placeholder:text-rose-300 focus:outline-none focus:ring-2 focus:ring-rose-300 focus:border-transparent disabled:opacity-60"
        />
      );
    }

    function Chip({ onClick, children }) {
      return (
        <button
          onClick={onClick}
          className="flex-shrink-0 px-3 py-1.5 text-xs font-medium text-rose-600 bg-white/80 backdrop-blur-sm border border-rose-200 rounded-full shadow-sm hover:bg-rose-50 hover:border-rose-300 transition-all active:scale-95"
        >
          {children}
        </button>
      );
    }

    // ========================================
    // 🧩 Chat Components
    // ========================================
    function WarningBanner({ message }) {
      if (!message) return null;
      return (
        <div className="px-4 py-2 bg-amber-50/90 border-b border-amber-200 text-[11px] text-amber-800 leading-snug">
          {message}
        </div>
      );
    }

    function ChatHeader({ onReset, messageCount }) {
      return (
        <header className="flex items-center justify-between px-4 py-3 bg-white/70 backdrop-blur-md border-b border-rose-100 rounded-t-3xl">
          <div className="flex items-center gap-3">
            <div className="relative">
              <div className="w-11 h-11 flex items-center justify-center text-2xl rounded-full bg-gradient-to-br from-rose-200 via-pink-200 to-amber-100 shadow-inner">
                {COUNSELOR_EMOJI}
              </div>
              <span className="status-dot absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white" aria-label="온라인"></span>
            </div>
            <div className="leading-tight">
              <h1 className="text-sm font-bold text-gray-800">{COUNSELOR_NAME} <span className="text-rose-400">{COUNSELOR_EMOJI}</span></h1>
              <p className="text-[11px] text-green-600 font-medium flex items-center gap-1">
                <span>온라인</span>
                <span className="text-gray-400">· 언제나 당신 편</span>
              </p>
            </div>
          </div>
          <Button
            variant="ghost"
            size="sm"
            onClick={onReset}
            disabled={messageCount <= 1}
            ariaLabel="대화 초기화"
          >
            대화 초기화
          </Button>
        </header>
      );
    }

    function MessageBubble({ message }) {
      const isUser = message.role === 'user';
      return (
        <div className={`flex items-end gap-2 animate-fade-in-up ${isUser ? 'justify-end' : 'justify-start'}`}>
          {!isUser && (
            <div className="w-8 h-8 flex-shrink-0 flex items-center justify-center text-lg rounded-full bg-gradient-to-br from-rose-200 to-pink-200 shadow-sm">
              {COUNSELOR_EMOJI}
            </div>
          )}
          <div className={`flex flex-col max-w-[78%] ${isUser ? 'items-end' : 'items-start'}`}>
            <div
              className={`px-4 py-2.5 text-sm leading-relaxed whitespace-pre-wrap break-words shadow-sm ${
                isUser
                  ? 'bg-gradient-to-br from-rose-400 to-pink-500 text-white rounded-3xl rounded-br-md'
                  : 'bg-white text-gray-800 border border-rose-100 rounded-3xl rounded-bl-md'
              }`}
            >
              {message.text}
            </div>
            <span className="mt-1 text-[10px] text-gray-400 px-1">{formatTime(message.ts)}</span>
          </div>
        </div>
      );
    }

    function TypingIndicator() {
      return (
        <div className="flex items-end gap-2 animate-fade-in-up">
          <div className="w-8 h-8 flex-shrink-0 flex items-center justify-center text-lg rounded-full bg-gradient-to-br from-rose-200 to-pink-200 shadow-sm">
            {COUNSELOR_EMOJI}
          </div>
          <div className="flex flex-col items-start">
            <div className="px-4 py-3 bg-white border border-rose-100 rounded-3xl rounded-bl-md shadow-sm">
              <div className="flex items-center gap-1" aria-label="상담사가 입력 중">
                <span className="w-2 h-2 bg-rose-300 rounded-full animate-bounce" style={{ animationDelay: '0ms' }}></span>
                <span className="w-2 h-2 bg-rose-300 rounded-full animate-bounce" style={{ animationDelay: '150ms' }}></span>
                <span className="w-2 h-2 bg-rose-300 rounded-full animate-bounce" style={{ animationDelay: '300ms' }}></span>
              </div>
            </div>
            <span className="mt-1 text-[10px] text-gray-400 px-1">상담사가 입력 중...</span>
          </div>
        </div>
      );
    }

    function MessageList({ messages, isTyping }) {
      const scrollRef = useRef(null);
      const bottomRef = useRef(null);

      useEffect(() => {
        if (bottomRef.current) {
          bottomRef.current.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }
      }, [messages, isTyping]);

      return (
        <div
          ref={scrollRef}
          className="chat-scroll flex-1 overflow-y-auto px-4 py-5 space-y-4"
          role="log"
          aria-live="polite"
        >
          {messages.length === 0 && !isTyping && (
            <div className="flex flex-col items-center justify-center h-full text-center text-gray-400 text-sm gap-2">
              <div className="text-4xl">🌸</div>
              <p>대화를 시작해 보세요</p>
            </div>
          )}
          {messages.map((m) => (
            <MessageBubble key={m.id} message={m} />
          ))}
          {isTyping && <TypingIndicator />}
          <div ref={bottomRef} />
        </div>
      );
    }

    function QuickPrompts({ onPick, disabled }) {
      return (
        <div className="px-4 pt-2 pb-1">
          <div className="flex gap-2 overflow-x-auto chat-scroll pb-1" style={{ scrollbarWidth: 'thin' }}>
            {QUICK_PROMPTS.map((p, i) => (
              <Chip key={i} onClick={() => !disabled && onPick(p)}>{p}</Chip>
            ))}
          </div>
        </div>
      );
    }

    function ChatInput({ onSend, disabled }) {
      const [value, setValue] = useState('');
      const trimmed = value.trim();
      const canSend = trimmed.length > 0 && !disabled;

      const handleSend = () => {
        if (!canSend) return;
        onSend(trimmed);
        setValue('');
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      };

      return (
        <div className="px-4 py-3 bg-white/70 backdrop-blur-md border-t border-rose-100 rounded-b-3xl">
          <div className="flex items-center gap-2">
            <div className="flex-1">
              <TextInput
                value={value}
                onChange={setValue}
                onKeyDown={handleKeyDown}
                placeholder="고민을 편하게 털어놔 보세요..."
                disabled={disabled}
                ariaLabel="메시지 입력"
              />
            </div>
            <Button
              onClick={handleSend}
              disabled={!canSend}
              size="md"
              ariaLabel="메시지 전송"
              className="!px-4"
            >
              전송 ✨
            </Button>
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Chat Page
    // ========================================
    function ChatPage() {
      const [messages, setMessages] = useState(() => {
        const stored = loadHistory();
        if (stored) return stored;
        return [
          makeMessage('bot', '안녕하세요! 저는 하트 상담사예요 💕\n오늘 어떤 고민이 있으신가요? 편하게 말씀해 주세요.'),
        ];
      });
      const [isTyping, setIsTyping] = useState(false);
      const [warning, setWarning] = useState('');
      const messagesRef = useRef(messages);

      // Keep a ref to latest messages so sendMessage can build history without stale closure
      useEffect(() => {
        messagesRef.current = messages;
      }, [messages]);

      // Persist on change
      useEffect(() => {
        saveHistory(messages);
      }, [messages]);

      // Health check on mount
      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            const res = await fetch(`${API_BASE_URL}/health`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            if (cancelled) return;
            if (data.hasApiKey === false) {
              setWarning('⚠️ 서버에 OpenAI API 키가 설정되지 않아 응답을 받을 수 없어요. OPENAI_API_KEY 환경변수를 설정해주세요.');
            }
          } catch (err) {
            console.error('[health check failed]', err);
            if (cancelled) return;
            setWarning('⚠️ 서버에 연결할 수 없어요. 로컬 서버(server.js)가 실행 중인지 확인해주세요.');
          }
        })();
        return () => { cancelled = true; };
      }, []);

      const sendMessage = useCallback(async (text) => {
        const userMsg = makeMessage('user', text);
        // Build history BEFORE adding the new user message (latest user msg goes in `message`)
        const prior = messagesRef.current.slice(-10).map((m) => ({
          role: m.role === 'user' ? 'user' : 'assistant',
          content: m.text,
        }));
        setMessages((prev) => [...prev, userMsg]);
        setIsTyping(true);

        try {
          const res = await fetch(`${API_BASE_URL}/chat`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, history: prior }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            console.error('[chat api error]', res.status, data);
            throw new Error(data.error || `HTTP ${res.status}`);
          }
          const reply = (data && typeof data.reply === 'string' && data.reply.trim())
            ? data.reply
            : ERROR_REPLY;
          setMessages((prev) => [...prev, makeMessage('bot', reply)]);
        } catch (err) {
          console.error('[sendMessage failed]', err);
          setMessages((prev) => [...prev, makeMessage('bot', ERROR_REPLY)]);
        } finally {
          setIsTyping(false);
        }
      }, []);

      const handleQuickPrompt = useCallback((prompt) => {
        sendMessage(prompt);
      }, [sendMessage]);

      const handleReset = useCallback(() => {
        setIsTyping(false);
        const fresh = [
          makeMessage('bot', '대화를 새로 시작했어요 🌷\n오늘은 어떤 이야기를 나눠볼까요?'),
        ];
        setMessages(fresh);
      }, []);

      return (
        <div className="flex flex-col w-full max-w-md h-[100dvh] md:h-[92vh] md:my-[4vh] md:rounded-3xl md:shadow-2xl bg-white/40 backdrop-blur-sm border border-white/60 overflow-hidden">
          <ChatHeader onReset={handleReset} messageCount={messages.length} />
          <WarningBanner message={warning} />
          <MessageList messages={messages} isTyping={isTyping} />
          <QuickPrompts onPick={handleQuickPrompt} disabled={isTyping} />
          <ChatInput onSend={sendMessage} disabled={isTyping} />
        </div>
      );
    }

    // ========================================
    // 🚀 App Root
    // ========================================
    function App() {
      return (
        <div className="min-h-full w-full flex items-start md:items-center justify-center">
          <ChatPage />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
